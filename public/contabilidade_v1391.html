<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulo Contábil · Painel Executivo</title>
<style>
/* v13.91 · Módulo Contábil executivo (multiempresas). Dentro do painel, as cores seguem o tema do ambiente ativo (tokens copiados
   do painel: paleta institucional ou a paleta da white-label). */
:root{
  --navy:#1B2362; --accent:#3F5BD8; --accent-soft:#E6EBFD;
  --bg:#F2F3F8; --panel:#FFFFFF; --panel-2:#F8F9FC; --line:#E2E4EE; --line-soft:#ECEEF5;
  --ink:#151934; --ink-soft:#585E7F; --ink-faint:#616787;
  --ok:#1D7A4E; --ok-soft:#E1F3E9; --warn:#9A6408; --warn-soft:#FCF0D6; --bad:#B63A2F; --bad-soft:#FBE7E4;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-embed]){
  --navy:#C9D0FF; --accent:#8EA2FF; --accent-soft:#232C55;
  --bg:#0E1120; --panel:#161A2C; --panel-2:#1C2136; --line:#2A3050; --line-soft:#232842;
  --ink:#E8EAF6; --ink-soft:#AEB3CF; --ink-faint:#A3A8C6;
  --ok:#5FD39A; --ok-soft:#163528; --warn:#F2C065; --warn-soft:#3A2E12; --bad:#FF8A7E; --bad-soft:#3D1D1A; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:16px}
:root[data-embed] body{padding:4px 2px 24px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 8px} h3{font-size:14px;margin:14px 0 6px}
p{margin:0 0 8px}
.topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
:root[data-embed] .topo{display:none}
.muted{color:var(--ink-soft)} .hint{color:var(--ink-soft);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px;margin-bottom:12px}
.tabs button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer}

.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row.between{justify-content:space-between;align-items:center}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo>span{font-size:12px;font-weight:600;color:var(--ink-soft)}

input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
:root[data-escuro] .btn:not(.sec):not(.danger){color:#0E1120}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}

.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--line-soft);color:var(--ink-soft);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--ink)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}

tr.sint td{font-weight:700} tr.inativa td{color:var(--ink-faint);text-decoration:line-through}

.vazio{padding:18px;text-align:center;color:var(--ink-soft)}
.rel-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}

/* ---------- v13.91 · painel executivo ---------- */
h1,h2,h3{color:var(--falco-tit,var(--ink))}
.topo-disp{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:8px 0 10px;background:var(--bg)}

.dcard .dm{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dcard.esq b{background:var(--line-soft);border-radius:6px;height:22px;width:70%}
.empcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}

.empcard>summary::after{content:'▾';margin-left:auto;color:var(--ink-soft);transition:transform .15s} .empcard[open]>summary::after{transform:rotate(180deg)}
.emp-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;flex:none}

.emp-corpo{border-top:1px solid var(--line-soft);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.atalhos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.atalho{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.atalho:hover{border-color:var(--accent)} .atalho b{font-size:13.5px} .atalho span{font-size:12px;color:var(--ink-soft)}
.escr{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}

.seg{display:inline-flex;flex-wrap:wrap;gap:4px} .seg button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff} :root[data-escuro] .seg button.on{color:var(--bg)}
.subtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin:0 0 12px;padding:0 2px}

.subtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 12px}
.kpi{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .kt{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin-top:3px} .kpi .ks{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi.ok{border-left:4px solid var(--ok)} .kpi.bad{border-left:4px solid var(--bad)} .kpi.warn{border-left:4px solid var(--warn)}
.selo{display:flex;align-items:center;gap:10px;border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 12px;background:var(--accent-soft)}
.selo-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;flex:none} :root[data-escuro] .selo-ic{color:var(--bg)}
.selo b{display:block;font-size:12.5px} .selo span{font-size:12.5px;color:var(--ink-soft)}
.radar-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{--c:var(--ok);width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--line-soft) 0);display:grid;place-items:center;flex:none}
.ring[data-faixa="atencao"]{--c:var(--warn)} .ring[data-faixa="critico"]{--c:var(--bad)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums} .ring span{font-size:11px;color:var(--ink-soft);display:block}
.barra{height:8px;border-radius:6px;background:var(--line-soft);overflow:hidden} .barra i{display:block;height:100%;background:var(--accent);border-radius:6px}
.subnotas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:10px}
.subnotas .row{justify-content:space-between;margin-bottom:4px}
.sugs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sug{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2)}
.sug.alta{border-left:4px solid var(--bad)} .sug.media{border-left:4px solid var(--warn)} .sug.baixa{border-left:4px solid var(--accent)}
.sug p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)} .sug .sug-l{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-soft)}
.cmp-t td.var{font-size:12px} .cmp-t td.var.up{color:var(--ok)} .cmp-t td.var.dn{color:var(--bad)}
tr.tit td{font-weight:800;text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);background:var(--panel-2)}
.mdl-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.mdl{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mdl.largo{width:min(1000px,100%)} .mdl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel)}
.mdl-b{padding:14px 16px} .mdl iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.lin-soc{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) 90px 34px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:980px){ .topo-disp{grid-template-columns:repeat(2,minmax(0,1fr));position:static} .emp-corpo{grid-template-columns:1fr} }
@media (max-width:560px){ .topo-disp{grid-template-columns:1fr 1fr;gap:6px} .dcard b{font-size:16px} .atalhos{grid-template-columns:1fr} .radar-top{grid-template-columns:1fr;justify-items:center} .subnotas{grid-template-columns:1fr} .sug{grid-template-columns:1fr} .lin-soc{grid-template-columns:1fr 1fr} }
@media print{ body{background:#fff;color:#000;padding:0} .no-print,.tabs,.topo,.toast,.topo-disp,.empcard,.subtabs{display:none!important} .panel{border:0;padding:0} .tbl{max-height:none;overflow:visible;border:0} th{position:static} }

<body>
<div class="topo"><div><h1>Módulo Contábil</h1><p class="muted" style="margin:0">Painel executivo multiempresas: disponibilidades, relatórios, Radar de Saúde e laudo técnico.</p></div><a class="btn sec sm" href="./">Voltar ao painel</a></div>
<div id="app"><div class="panel"><p class="muted" style="margin:0">Carregando o Módulo Contábil…</p></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* =====================================================================
   v13.91 · MÓDULO CONTÁBIL EXECUTIVO (contabilidade_v1391.html) — multiempresas, barra de disponibilidades, relatórios em abas
   horizontais com KPIs, Radar de Saúde Empresarial, Motor de Crítica (sugestões de ação e correção) e Laudo Técnico em PDF.
   Base: v13.86 (contabilidade.html) — fala com /api/contabil (mesma origem do painel).
   As regras ficam no servidor e no banco: partidas dobradas, lançamentos intangíveis (só estorno), período
   fechado e cadeia de conferência. Esta tela só monta os pedidos e mostra as respostas.
   Abas: Radar de Saúde · Relatórios · Lançamentos · Plano de contas · De-para do FCX · Empresas · Parâmetros.
   ===================================================================== */
const EMBED = new URLSearchParams(location.search).has('embed');
const PAI = (() => { try { return window.parent !== window && window.parent.PainelFCX ? window.parent : null; } catch (e) { return null; } })();
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = v => (Math.round((Number(v) || 0) * 10000) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const dataBR = d => (d ? String(d).slice(0, 10).split('-').reverse().join('/') : '');
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
/** "1.234,56" | "1234.56" | 1234.56 → número */
const lerValor = v => { if (typeof v === 'number') return v; const s = String(v || '').trim().replace(/\s|R\$/g, ''); if (!s) return NaN; return Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); };
const cent = v => Math.round(lerValor(v) * 100);

async function api(met, rota, corpo) {
  const r = await fetch('/api/contabil' + rota, { method: met, credentials: 'same-origin', cache: 'no-store', headers: { 'x-painel': '1', ...(corpo !== undefined ? { 'content-type': 'application/json' } : {}) }, body: corpo === undefined ? undefined : JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.erro || 'Erro ' + r.status + ' no servidor.'); e.status = r.status; e.dados = j; throw e; }
  return j;
}
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }
const falhou = e => toast(e && e.message ? e.message : String(e));
/** confirmação em dois cliques (confirm() pode ser bloqueado em molduras) */
let pend = null;
function confirmar(chave, msg) { const t = Date.now(); if (pend && pend.k === chave && t - pend.t < 6000) { pend = null; return true; } pend = { k: chave, t }; toast(msg + ' Clique de novo para confirmar.'); return false; }

/* ---------- tema: dentro do painel, copia os tokens de cor do painel (e acompanha a troca de tema) ---------- */
const TOK = ['--navy', '--accent', '--accent-soft', '--bg', '--panel', '--panel-2', '--line', '--line-soft', '--ink', '--ink-soft', '--ink-faint', '--ok', '--ok-soft', '--warn', '--warn-soft', '--bad', '--bad-soft', '--falco-tit', '--falco-ouro'];
function lum(c) { /* v13.91: hex (#19283f) ou rgb(…) — antes os dígitos do hex eram lidos como rgb e o tema escuro não era reconhecido */ const t = String(c).trim(); if (t[0] === '#') { let h = t.slice(1); if (h.length === 3) h = h.split('').map(x => x + x).join(''); if (h.length < 6) return 1; return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0); } const m = t.match(/[\d.]+/g); if (!m || m.length < 3) return 1; return (m[0] * 0.2126 + m[1] * 0.7152 + m[2] * 0.0722) / 255; }
function tema() {
  if (!PAI) return;
  try { const cs = PAI.getComputedStyle(PAI.document.documentElement), r = document.documentElement; let n = 0;
    TOK.forEach(t => { const v = cs.getPropertyValue(t).trim(); if (v) { r.style.setProperty(t, v); n++; } else r.style.removeProperty(t); });
    if (n) { r.dataset.embed = '1'; const esc_ = lum(cs.getPropertyValue('--bg').trim() || '#fff') < 0.4; r.toggleAttribute('data-escuro', esc_); r.style.colorScheme = esc_ ? 'dark' : 'light'; }
  } catch (e) { /* sem acesso ao painel: tema próprio */ }
}
if (PAI) { tema(); try { new PAI.MutationObserver(tema).observe(PAI.document.documentElement, { attributes: true }); PAI.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(tema, 50)); } catch (e) { } }
else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-escuro', '');

/* ---------- estado ---------- */
const S = {
  aba: 'radar', st: null, contas: [], erro: null, emp: 'emp_principal', empAberto: false, disp: null, radar: null, ef: null,
  pl: { busca: '', tipo: '', grupo: '', inativas: false, edit: null, sug: null, nome: '', pai: '' },
  dp: { itens: null, resumo: null, busca: '', status: '', edit: null },
  lf: null, ls: { lista: null, de: '', ate: '', conta: '', estorno: null },
  rl: { tipo: 'diario', de: '', ate: '', modelo: '', anoReforma: '', conta: '', regime: '', dados: null, cmp: null, comparar: true, carregando: false },
  pr: { lalur: null, ano: new Date().getFullYear(), integ: null },
};
const ABAS = [['radar', 'Radar de Saúde'], ['relatorios', 'Relatórios'], ['lancamentos', 'Lançamentos'], ['plano', 'Plano de contas'], ['depara', 'De-para do FCX'], ['empresas', 'Empresas'], ['parametros', 'Parâmetros']];
const KEMP = 'contabil:empresa';
try { const e = localStorage.getItem(KEMP); if (e) S.emp = e; } catch (e) { /* sem armazenamento: empresa principal */ }

async function irAba(a, forcar = false) {
  if (!ABAS.some(x => x[0] === a)) return;
  S.aba = a; render();
  try {
    if (a === 'radar' && S.st.plano.criado && (!S.radar || forcar)) await carregarRadar();
    if (a === 'relatorios' && S.st.plano.criado && !S.rl.dados && !S.rl.carregando && (S.rl.tipo !== 'razao' || S.rl.conta)) await acoes['rl-gerar']();
    if (a === 'depara' && !S.dp.itens) { await carregarDepara(); render(); }
    if (a === 'lancamentos' && !S.ls.lista) { await carregarLancs(); render(); }
    if (a === 'parametros' && !S.pr.lalur) { S.pr.lalur = (await api('GET', '/lalur?ano=' + S.pr.ano)).ajustes; render(); }

}

  const D = S.dp, r = D.resumo, q = D.busca.toLowerCase().trim(), gerir = pode('contabil.plano');
  const lista = D.itens.filter(x => (!D.status || (D.status === 'agrupador' ? x.agrupador : D.status === 'inativa' ? !x.ativa : D.status === 'contabil' ? x.fonte === 'contabil' : x.status === D.status && !x.agrupador)) && (!q || x.chave.toLowerCase().includes(q) || (x.conta || '').startsWith(q) || (x.contaNome || '').toLowerCase().includes(q)));
  const auto = D.itens.filter(x => x.status === 'automatico' && x.ativa && x.conta);
  const linhas = lista.map(x => {
    const s = x.agrupador ? ['', 'Agrupador'] : ST_DP[x.status] || ST_DP.pendente, ed = D.edit === x.chave;
    const cont = ed ? `<div class="row"><input id="dp-conta" list="${x.agrupador ? 'dlS' : 'dlA'}" value="${esc(x.conta || '')}" class="mono" style="width:150px" aria-label="Conta contábil para ${esc(x.chave)}"><button class="btn sm" data-a="dp-salvar" data-v="${esc(x.chave)}">Salvar</button><button class="btn sec sm" data-a="dp-editar" data-v="">Cancelar</button></div><span class="hint">${x.agrupador ? 'Agrupador do ERP: escolha uma conta sintética.' : 'Recebe lançamentos: escolha uma conta analítica.'}</span>`

  if (D && D.montar) return D.montar(tit, D.cabecalho(tit, sub) + corpo, { paisagem, margem: '12mm 10mm', css: CSS_DOC });
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(tit)}</title><style>@page{size:A4${paisagem ? ' landscape' : ''};margin:12mm 10mm} body{font-family:system-ui,Arial,sans-serif;color:#151934;font-size:10pt;margin:0;padding:16px} ${CSS_DOC}</style></head><body><h1 style="font-size:16pt;margin:0">${esc(tit)}</h1><p class="hint" style="margin:2px 0 12px">${esc(sub)}</p>${corpo}</body></html>`;
}
function previaDoc(tit, html, nome) {
  const D = PAI && PAI.Documento;
  if (D && D.previa) return D.previa(tit, html, nome);
  const m = abrirModal('Pré-visualização — ' + tit, `<div class="row" style="margin-bottom:8px"><button class="btn" data-a="mdl-imprimir">Imprimir / salvar em PDF</button></div><iframe title="${esc(tit)}"></iframe>`, true);
  $('iframe', m).srcdoc = html;
}
function nomeArq(t) { return `${t.replace(/[^\wÀ-ú]+/g, '_')}_${(empAtual().nomeFantasia || empAtual().razaoSocial || '').replace(/[^\wÀ-ú]+/g, '_').slice(0, 30)}_${S.rl.de}_a_${S.rl.ate}`; }
function docRelatorio() {
  const R = S.rl, el = $('#relatorio'); if (!el) return null;
  const tit = (RELS.find(x => x[0] === R.tipo) || [R.tipo, 'Relatório'])[1], e = empAtual();
  const sub = `${e.razaoSocial} · CNPJ ${cnpjF(e.cnpj)} · ${rotPer(R.de, R.ate)}${crcTxt(e.contador) ? ' · Responsável técnico: ' + crcTxt(e.contador) : ''}`;
  return { tit, nome: nomeArq(tit), html: montarDoc(tit, sub, el.innerHTML, ['balancete', 'diario', 'razao', 'caixa', 'dmpl'].includes(R.tipo) || (R.tipo === 'balanco' && !!R.cmp) || (CMP.has(R.tipo) && !!R.cmp)) };
}

async function recarregarBase() { await carregarBase(); render(); }
async function importarFCX() {
  if (!PAI || !PAI.PainelFCX || !PAI.PainelFCX.contasFCX) return toast('Abra o Módulo Contábil pelo painel (menu Contabilidade) para importar as contas do FCX.');
  toast('Lendo as contas do FCX…');
  const f = await PAI.PainelFCX.contasFCX();
  const r = await api('POST', '/importar-fcx', { contas: f.contas, usadas: f.usadas });
  await carregarBase(); await carregarDepara(); S.aba = 'depara'; render(); avisarFCX();
  toast(`${r.planoCriado ? 'Plano padrão criado (' + r.planoCriado + ' contas). ' : ''}${r.novos} conta(s) do FCX mapeadas${r.criadas.length ? ', ' + r.criadas.length + ' conta(s) nova(s) no plano' : ''}${r.complemento ? ', ' + r.complemento + ' da Reforma para o FCX' : ''} · ${r.resumo.pendente} pendente(s) de revisão.`);
}

  'pl-editar'(el) { S.pl.edit = el.dataset.v || null; render(); },

  async sug(el) {
    const x = (S.radar && S.radar.sugestoes || [])[Number(el.dataset.v)]; const a = x && x.acao; if (!a) return;
    if (a.tipo === 'lancamento') { if (!pode('contabil.lancar')) return toast('Seu acesso não lança: peça a quem lança no Módulo Contábil.'); S.lf = { data: S.rl.ate && S.rl.ate < hoje() ? S.rl.ate : hoje(), historico: a.proposta.historico, docRef: 'RADAR-' + x.id.replace(/^inv:/, ''), itens: a.proposta.itens.map(i => ({ conta: i.conta, dc: i.dc, valor: fmtN(i.valor), historico: '' })) }; await irAba('lancamentos'); toast('Correção proposta pelo Motor de Crítica: confira as partidas e clique em Gravar lançamento.'); $('#lf-hist')?.focus(); return; }

  'mdl-fechar'() { fecharModal(); },

  async 'emp-sel'(el) { S.emp = el.dataset.v; try { localStorage.setItem(KEMP, S.emp); } catch (e) { } toast('Empresa ativa: ' + (empAtual().nomeFantasia || empAtual().razaoSocial)); await aoMudarContexto(); },

  'emp-socios'() { const e = empAtual(), so = e.socios || []; abrirModal('Quadro de sócios e administradores', `<p class="hint" style="margin-top:0">${esc(e.razaoSocial)} · CNPJ ${esc(cnpjF(e.cnpj))} · capital social ${fmt(e.capitalSocial)}</p>${so.length ? `<div class="tbl"><table><thead><tr><th>Sócio</th><th>Documento</th><th>Qualificação</th><th class="num">Participação</th><th class="num">Capital</th></tr></thead><tbody>${so.map(x => `<tr><td>${esc(x.nome)}</td><td class="mono">${esc(x.documento || '—')}</td><td>${esc(x.qualificacao || '')}</td><td class="num">${fmtN(x.participacao)}%</td><td class="num">${fmtN((Number(e.capitalSocial) || 0) * (Number(x.participacao) || 0) / 100)}</td></tr>`).join('')}<tr class="tot"><td colspan="3">Total</td><td class="num">${fmtN(so.reduce((a, x) => a + (Number(x.participacao) || 0), 0))}%</td><td class="num">${fmtN(e.capitalSocial)}</td></tr></tbody></table></div>` : '<p>Nenhum sócio cadastrado.</p>'}<p class="hint">Responsável técnico: ${esc(crcTxt(e.contador) || 'não cadastrado')}</p>${pode('contabil.parametros') ? `<button class="btn sec sm" data-a="ef-editar" data-v="${esc(e.id)}">Editar na aba Empresas</button>` : ''}`); },
  async 'emp-escr'() { const es = S.disp && S.disp.escrituracao, ig = await api('GET', '/integridade'); abrirModal('Resumo da escrituração', `<div class="kpis">${K('Lançamentos no período', es ? es.lancamentos : '—')}${K('Σ Débitos', es ? fmt(es.debitos) : '—')}${K('Σ Créditos', es ? fmt(es.creditos) : '—')}${K('Partidas dobradas', es && es.confere ? 'Σ D = Σ C' : 'Diferença', '', es && es.confere ? 'ok' : 'bad')}</div><p>${ig.cadeiaIntegra && ig.equilibrados ? `<span class="pill ok">Íntegro</span> ${ig.lancamentos} lançamento(s) no banco: cadeia de conferência sem quebras e todos com D = C.` : `<span class="pill bad">Atenção</span> ${ig.quebras.length ? 'quebra na cadeia nos nº ' + ig.quebras.join(', ') + '. ' : ''}${ig.desequilibrados.length ? 'Desequilibrados: nº ' + ig.desequilibrados.join(', ') : ''}`}</p><p class="hint">${esc(empAtual().razaoSocial)} · ${dataBR(S.rl.de)} a ${dataBR(S.rl.ate)}</p>`); },
  async 'pg-aplicar'() { const de = $('#pg-de').value, ate = $('#pg-ate').value; if (!de || !ate || de > ate) return toast('Período inválido.'); S.rl.de = S.ls.de = de; S.rl.ate = S.ls.ate = ate; await aoMudarContexto(); },
  'ef-nova'() { S.ef = novaEmpresa(); render(); $('[data-ef="cnpj"]')?.focus(); },
  'ef-editar'(el) { const e = empresas().find(x => x.id === el.dataset.v); if (!e) return; fecharModal(); S.ef = JSON.parse(JSON.stringify({ ...novaEmpresa(), ...e, capitalSocial: fmtN(e.capitalSocial), socios: (e.socios || []).length ? e.socios.map(x => ({ ...x, participacao: fmtN(x.participacao) })) : novaEmpresa().socios, contador: { ...novaEmpresa().contador, ...(e.contador || {}) } })); if (S.aba !== 'empresas') return irAba('empresas'); render(); },
  'ef-cancelar'() { S.ef = null; render(); },
  'ef-regime'(el) { S.ef.regime = el.dataset.v; render(); },
  'ef-mais'() { S.ef.socios.push({ nome: '', documento: '', qualificacao: 'Sócio', participacao: '' }); render(); },
  'ef-tirar'(el) { S.ef.socios.splice(Number(el.dataset.v), 1); render(); },
  async 'ef-salvar'() {
    const F = S.ef, d = { cnpj: F.cnpj, razaoSocial: F.razaoSocial, nomeFantasia: F.nomeFantasia, regime: F.regime, capitalSocial: lerValor(F.capitalSocial) || 0, endereco: F.endereco, contador: F.contador, ativa: F.ativa,
      socios: F.socios.filter(x => String(x.nome || '').trim()).map(x => ({ ...x, participacao: lerValor(x.participacao) || 0 })) };
    const r = F.id ? await api('PUT', '/empresas?id=' + encodeURIComponent(F.id), d) : await api('POST', '/empresas', d);
    S.ef = null; await carregarBase(); render(); toast(`${r.empresa.razaoSocial} salva.`); if (r.empresa.id === empAtual().id) { await carregarDisp(); render(); }

  async 'pp-salvar'() {
    const n = id => lerValor($(id).value) / 100, d = { regime: ($('[name="pp-regime"]:checked') || {}).value, dreModelo: ($('[name="pp-dre"]:checked') || {}).value, lc224: $('#pp-lc224').checked, contaResultado: $('#pp-res').value,

  async 'lz-ver'() { S.pr.ano = Number($('#lz-ano').value) || S.pr.ano; S.pr.lalur = (await api('GET', '/lalur?ano=' + S.pr.ano)).ajustes; render(); },
  async 'lz-incluir'() { await api('POST', '/lalur', { ano: S.pr.ano, tipo: $('#lz-tipo').value, base: $('#lz-base').value, descricao: $('#lz-desc').value, valor: $('#lz-valor').value }); await acoes['lz-ver'](); toast('Ajuste do LALUR incluído.'); },
  async 'lz-tirar'(el) { if (!confirmar('lz' + el.dataset.v, 'Remover este ajuste do LALUR?')) return; await api('DELETE', '/lalur?id=' + el.dataset.v); await acoes['lz-ver'](); },
  async enc() { const ano = Number($('#pe-ano').value); if (!confirmar('enc' + ano, `Encerrar o exercício de ${ano} de ${empAtual().razaoSocial}? As contas de resultado serão zeradas contra ${S.st.parametros.contaResultado}.`)) return; const r = await api('POST', '/encerramento', { ano, empresa: empAtual().id }); await carregarBase(); render(); toast(`Exercício de ${ano} encerrado: resultado ${fmt(r.resultado)}.`); },

async function aplicarDepara(r) { const m = new Map(r.itens.map(x => [x.chave, x])); S.dp.itens = S.dp.itens.map(x => m.get(x.chave) || x); S.dp.resumo = r.resumo; if (S.st) S.st.depara = r.resumo; render(); avisarFCX(); }
function lerCtlRel() { const R = S.rl, g = id => ($(id) ? $(id).value : null); R.de = g('#rl-de') || R.de; R.ate = g('#rl-ate') || R.ate; if ($('#rl-conta')) { if (R.tipo === 'caixa') R.contaCaixa = g('#rl-conta').trim(); else R.conta = g('#rl-conta').trim(); } }

let ocupado = false;
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const f = acoes[el.dataset.a]; if (!f) return;
  e.preventDefault(); if (ocupado) return; ocupado = true; el.setAttribute('aria-busy', 'true');
  try { await f(el); } catch (err) { falhou(err); } finally { ocupado = false; el.removeAttribute('aria-busy'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pl-busca') { S.pl.busca = t.value; return render(); }
  if (t.id === 'dp-busca') { S.dp.busca = t.value; return render(); }
  if (t.id === 'lf-data') S.lf.data = t.value; if (t.id === 'lf-hist') S.lf.historico = t.value; if (t.id === 'lf-doc') S.lf.docRef = t.value;
  if (t.dataset.ef != null && S.ef) { const [a, b] = t.dataset.ef.split('.'); if (b) S.ef[a][b] = t.value; else if (t.type !== 'checkbox') S.ef[a] = t.value; }
  if (t.dataset.si != null && S.ef) S.ef.socios[Number(t.dataset.si)][t.dataset.f] = t.value;
  if (t.dataset.li != null) { const i = S.lf.itens[Number(t.dataset.li)]; i[t.dataset.f] = t.value; if (t.dataset.f === 'conta') { const x = porCodigo().get(t.value.trim()), h = t.parentElement.querySelector('.opc.hint, span.hint'); if (h) h.textContent = x ? x.nome : t.value ? 'conta não encontrada' : ''; } }
  if (S.aba === 'lancamentos') atualizarTotais();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pl-tipo') { S.pl.tipo = t.value; render(); } if (t.id === 'pl-grupo') { S.pl.grupo = t.value; render(); } if (t.id === 'pl-inativas') { S.pl.inativas = t.checked; render(); }
  if (t.dataset.ef === 'ativa' && S.ef) S.ef.ativa = t.checked;
  if (t.id === 'rl-de' || t.id === 'rl-ate') lerCtlRel();
  if (t.dataset.li != null && t.dataset.f === 'dc') { S.lf.itens[Number(t.dataset.li)].dc = t.value; atualizarTotais(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pn-nome') { e.preventDefault(); acoes['pn-sugerir']().catch(falhou); }
  if (e.key === 'Enter' && e.target.id === 'dp-conta') { e.preventDefault(); $('[data-a="dp-salvar"]')?.click(); }
  if (e.key === 'Escape' && $('#mdl')) { fecharModal(); return; }
  const sub = e.target.closest && e.target.closest('.subtabs [role="tab"]');
  if (sub && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); const i = RELS.findIndex(a => a[0] === S.rl.tipo), n = RELS[(i + (e.key === 'ArrowRight' ? 1 : RELS.length - 1)) % RELS.length][0]; acoes['rl-aba']({ dataset: { v: n } }).catch(falhou); return; }
  const tab = e.target.closest && e.target.closest('.tabs [role="tab"]');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const i = ABAS.findIndex(a => a[0] === S.aba), n = ABAS[(i + (e.key === 'ArrowRight' ? 1 : ABAS.length - 1)) % ABAS.length][0]; irAba(n).then(() => $('#tab-' + n)?.focus()); }
});
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'empCard') S.empAberto = e.target.open; }, true);
window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.tipo === 'ct-aba') irAba(e.data.aba); });

async function iniciar() {
  try { await carregarBase(); }
  catch (e) { S.erro = e.status === 401 ? 'Sessão encerrada: entre no painel de novo.' : e.status === 403 ? 'Seu acesso não abre o Módulo Contábil (Gestão de Acessos › Contabilidade · Ler).' : e.message; return render(); }
  let a = (location.hash || '').slice(1); try { if (PAI && PAI.ModContabil && PAI.ModContabil.abaInicial) { a = PAI.ModContabil.abaInicial; PAI.ModContabil.abaInicial = null; } } catch (e) { }
  if (!empresas().some(e => e.id === S.emp && e.ativa !== false)) S.emp = 'emp_principal';
  carregarDisp().then(render);
  await irAba(ABAS.some(x => x[0] === a) ? a : !S.st.plano.criado ? 'plano' : S.st.depara && S.st.depara.pendente && !S.st.lancamentos.total ? 'depara' : 'radar');
}
window.Contabil = { S, irAba, api, versao: 'v13.91', laudoHTML, docRelatorio }; /* para testes */
iniciar();
