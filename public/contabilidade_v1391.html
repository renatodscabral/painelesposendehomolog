<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulo Contábil · Painel Executivo</title>
<style>
/* v13.91 · Módulo Contábil executivo (multiempresas). Dentro do painel, as cores seguem o tema do ambiente ativo (tokens copiados
   do painel: paleta institucional ou a paleta da white-label). */
:root{
  --navy:#1B2362; --accent:#3F5BD8; --accent-soft:#E6EBFD;
  --bg:#F2F3F8; --panel:#FFFFFF; --panel-2:#F8F9FC; --line:#E2E4EE; --line-soft:#ECEEF5;
  --ink:#151934; --ink-soft:#585E7F; --ink-faint:#616787;
  --ok:#1D7A4E; --ok-soft:#E1F3E9; --warn:#9A6408; --warn-soft:#FCF0D6; --bad:#B63A2F; --bad-soft:#FBE7E4;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-embed]){
  --navy:#C9D0FF; --accent:#8EA2FF; --accent-soft:#232C55;
  --bg:#0E1120; --panel:#161A2C; --panel-2:#1C2136; --line:#2A3050; --line-soft:#232842;
  --ink:#E8EAF6; --ink-soft:#AEB3CF; --ink-faint:#A3A8C6;
  --ok:#5FD39A; --ok-soft:#163528; --warn:#F2C065; --warn-soft:#3A2E12; --bad:#FF8A7E; --bad-soft:#3D1D1A; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:16px}
:root[data-embed] body{padding:4px 2px 24px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 8px} h3{font-size:14px;margin:14px 0 6px}
p{margin:0 0 8px}
.topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
:root[data-embed] .topo{display:none}
.muted{color:var(--ink-soft)} .hint{color:var(--ink-soft);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px;margin-bottom:12px}
.tabs button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row.between{justify-content:space-between;align-items:center}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo>span{font-size:12px;font-weight:600;color:var(--ink-soft)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
:root[data-escuro] .btn:not(.sec):not(.danger){color:#0E1120}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--line-soft);color:var(--ink-soft);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--ink)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:62vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel-2);font-size:12px;color:var(--ink-soft);z-index:1}
tr.sint td{font-weight:700} tr.inativa td{color:var(--ink-faint);text-decoration:line-through}
tr.tot td{font-weight:700;border-top:2px solid var(--line)} tr.sub td{font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.ind1{padding-left:18px}.ind2{padding-left:32px}.ind3{padding-left:46px}.ind4{padding-left:60px}.ind5{padding-left:74px}
.edit-row td{background:var(--panel-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lin-lanc{display:grid;grid-template-columns:minmax(150px,2fr) 74px minmax(110px,1fr) minmax(100px,1fr) minmax(120px,1.5fr) 34px;gap:6px;align-items:center;margin-bottom:6px}
.tot-lanc{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-weight:600}
.tot-lanc .dif{color:var(--bad)} .tot-lanc .ok{color:var(--ok)}
details>summary{cursor:pointer;font-weight:600;padding:2px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.vazio{padding:18px;text-align:center;color:var(--ink-soft)}
.rel-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.cmp div{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px}
.cmp b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){ .grid2,.cmp{grid-template-columns:1fr} .lin-lanc{grid-template-columns:1fr 70px 1fr 34px} .lin-lanc .opc{display:none} body{padding:10px} }

/* ---------- v13.91 · painel executivo ---------- */
h1,h2,h3{color:var(--falco-tit,var(--ink))}
.topo-disp{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:8px 0 10px;background:var(--bg)}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0;border-top:3px solid var(--accent)}
.dcard.tot{border-top-color:var(--ok)}
.dcard .dt{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard b{display:block;font-size:19px;font-variant-numeric:tabular-nums;margin:3px 0 2px;color:var(--ink)} .dcard b.neg{color:var(--bad)}
.dcard .dm{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dcard.esq b{background:var(--line-soft);border-radius:6px;height:22px;width:70%}
.empcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.empcard>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;list-style:none}
.empcard>summary::-webkit-details-marker{display:none}
.empcard>summary::after{content:'▾';margin-left:auto;color:var(--ink-soft);transition:transform .15s} .empcard[open]>summary::after{transform:rotate(180deg)}
.emp-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;flex:none}
.emp-nome{font-weight:700} .emp-sub{font-size:12px;color:var(--ink-soft)}
.emp-corpo{border-top:1px solid var(--line-soft);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.atalhos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.atalho{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.atalho:hover{border-color:var(--accent)} .atalho b{font-size:13.5px} .atalho span{font-size:12px;color:var(--ink-soft)}
.escr{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
.escr .row{justify-content:space-between} .escr b{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px} .seg button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff} :root[data-escuro] .seg button.on{color:var(--bg)}
.subtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin:0 0 12px;padding:0 2px}
.subtabs button{flex:none;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink-soft);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 12px}
.kpi{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .kt{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin-top:3px} .kpi .ks{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi.ok{border-left:4px solid var(--ok)} .kpi.bad{border-left:4px solid var(--bad)} .kpi.warn{border-left:4px solid var(--warn)}
.selo{display:flex;align-items:center;gap:10px;border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 12px;background:var(--accent-soft)}
.selo-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;flex:none} :root[data-escuro] .selo-ic{color:var(--bg)}
.selo b{display:block;font-size:12.5px} .selo span{font-size:12.5px;color:var(--ink-soft)}
.radar-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{--c:var(--ok);width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--line-soft) 0);display:grid;place-items:center;flex:none}
.ring[data-faixa="atencao"]{--c:var(--warn)} .ring[data-faixa="critico"]{--c:var(--bad)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums} .ring span{font-size:11px;color:var(--ink-soft);display:block}
.barra{height:8px;border-radius:6px;background:var(--line-soft);overflow:hidden} .barra i{display:block;height:100%;background:var(--accent);border-radius:6px}
.subnotas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:10px}
.subnotas .row{justify-content:space-between;margin-bottom:4px}
.sugs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sug{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2)}
.sug.alta{border-left:4px solid var(--bad)} .sug.media{border-left:4px solid var(--warn)} .sug.baixa{border-left:4px solid var(--accent)}
.sug p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)} .sug .sug-l{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-soft)}
.cmp-t td.var{font-size:12px} .cmp-t td.var.up{color:var(--ok)} .cmp-t td.var.dn{color:var(--bad)}
tr.tit td{font-weight:800;text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);background:var(--panel-2)}
.mdl-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.mdl{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mdl.largo{width:min(1000px,100%)} .mdl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel)}
.mdl-b{padding:14px 16px} .mdl iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.lin-soc{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) 90px 34px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:980px){ .topo-disp{grid-template-columns:repeat(2,minmax(0,1fr));position:static} .emp-corpo{grid-template-columns:1fr} }
@media (max-width:560px){ .topo-disp{grid-template-columns:1fr 1fr;gap:6px} .dcard b{font-size:16px} .atalhos{grid-template-columns:1fr} .radar-top{grid-template-columns:1fr;justify-items:center} .subnotas{grid-template-columns:1fr} .sug{grid-template-columns:1fr} .lin-soc{grid-template-columns:1fr 1fr} }
@media print{ body{background:#fff;color:#000;padding:0} .no-print,.tabs,.topo,.toast,.topo-disp,.empcard,.subtabs{display:none!important} .panel{border:0;padding:0} .tbl{max-height:none;overflow:visible;border:0} th{position:static} }
</style>
<style id="ct96">
/* v13.96 · Módulo Contábil: partidas dobradas por extenso (Débito/Crédito em selo), código - nome na mesma coluna e cores por grupo contábil
   (Ativo verde · Passivo vermelho · Patrimônio Líquido azul · Resultado/DRE laranja) + aba Biblioteca CPC & Regras Fiscais.
   Tudo atrás da classe html.ct96 (recurso gestao_v1396): sem o recurso nada muda. Texto dos selos com contraste AA sobre o próprio fundo. */
html.ct96{--g1:#059669;--g1b:#D1FAE5;--g1t:#065F46;--g2:#DC2626;--g2b:#FEE2E2;--g2t:#991B1B;--g3:#2563EB;--g3b:#DBEAFE;--g3t:#1E40AF;--g4:#EA580C;--g4b:#FFEDD5;--g4t:#9A3412;--g0:#64748B;--g0b:#E2E8F0;--g0t:#334155}
html.ct96[data-escuro]{--g1:#10B981;--g1b:#064E3B;--g1t:#A7F3D0;--g2:#EF4444;--g2b:#7F1D1D;--g2t:#FECACA;--g3:#3B82F6;--g3b:#1E3A8A;--g3t:#BFDBFE;--g4:#F97316;--g4b:#7C2D12;--g4t:#FED7AA;--g0:#94A3B8;--g0b:#1E293B;--g0t:#E2E8F0}
html.ct96 .g0{--gi:var(--g0);--gb:var(--g0b);--gt:var(--g0t)} html.ct96 .g1{--gi:var(--g1);--gb:var(--g1b);--gt:var(--g1t)} html.ct96 .g2{--gi:var(--g2);--gb:var(--g2b);--gt:var(--g2t)}
html.ct96 .g3{--gi:var(--g3);--gb:var(--g3b);--gt:var(--g3t)} html.ct96 .g4{--gi:var(--g4);--gb:var(--g4b);--gt:var(--g4t)}
html.ct96 .dcb{display:inline-block;font:700 12px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.2px;padding:3px 12px;border-radius:999px;background:var(--gb);color:var(--gt);border:1px solid var(--gi);white-space:nowrap}
html.ct96 .dcsel{position:relative;display:block;min-width:0}
html.ct96 .dcsel select.dcb{display:block;width:100%;height:36px;appearance:none;-webkit-appearance:none;cursor:pointer;padding:0 26px 0 14px;font-size:13px}
html.ct96 .dcsel select.dcb option{background:var(--panel);color:var(--ink);font-weight:600}
html.ct96 .dcsel::after{content:"\25BE";position:absolute;right:11px;top:50%;transform:translateY(-52%);color:var(--gt);pointer-events:none;font-size:12px}
html.ct96 .lin-lanc{grid-template-columns:minmax(220px,3fr) 128px minmax(110px,1fr) minmax(150px,1.6fr) 34px;border-left:4px solid var(--gi,var(--line));padding-left:8px;border-radius:4px}
html.ct96 .lin-cab96{display:grid;grid-template-columns:minmax(220px,3fr) 128px minmax(110px,1fr) minmax(150px,1.6fr) 34px;gap:6px;padding-left:12px;margin:0 0 4px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
html.ct96 .lin-cab96 .v{text-align:right}
html.ct96 .lin-lanc input.cta96{font-weight:600}
html.ct96 .lin-lanc input.cta96.inv{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
html.ct96 .leg96{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:4px 0 8px;font-size:12px;color:var(--ink-soft)}
html.ct96 .leg96 .dcb{font-size:11.5px;padding:2px 10px}
html.ct96 .pts96{display:grid;gap:3px;margin-top:6px}
html.ct96 .pt96{display:grid;grid-template-columns:minmax(0,1fr) 88px 118px;align-items:center;gap:8px;border-left:4px solid var(--gi);padding:2px 0 2px 8px;max-width:680px}
html.ct96 .pt96.cr{margin-left:20px}

html.ct96 .pt96 .dcb{justify-self:start;font-size:11.5px;padding:2px 10px}
html.ct96 .pt96 .pt-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
html.ct96 td.dia96{border-left:4px solid var(--gi)}
html.ct96 td.dia96 .dcb{margin-left:8px;font-size:11px;padding:1px 9px}
html.ct96 .ex96{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:13px}

html.ct96 .ex96 td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
html.ct96 .ex96 td:nth-child(2){width:104px} html.ct96 .ex96 td.v{width:120px}
html.ct96 .ex96 tr.cr td:first-child{padding-left:26px}
html.ct96 .bib-barra{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin:8px 0 6px}

html.ct96 .bib-card{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);background:var(--panel);margin:0 0 10px;overflow:hidden}
html.ct96 .bib-card.fiscal{border-left-color:var(--warn)}

html.ct96 .bib-card>summary::-webkit-details-marker{display:none}
html.ct96 .bib-card>summary::before{content:"\25B8";color:var(--ink-soft);font-size:13px;width:14px}
html.ct96 .bib-card[open]>summary::before{content:"\25BE"}
html.ct96 .bib-card .bib-tit{font-weight:700;font-size:14.5px;color:var(--ink)}

html.ct96 .bib-corpo{padding:4px 18px 16px;border-top:1px solid var(--line-soft);max-width:1000px;line-height:1.55}
html.ct96 .bib-corpo h4{margin:16px 0 4px;font-size:13.5px;color:var(--ink)}
html.ct96 .bib-corpo p{margin:0 0 8px}
html.ct96 .bib-corpo ul{margin:4px 0 8px;padding-left:20px} html.ct96 .bib-corpo li{margin:3px 0}
html.ct96 .bib-corpo .tbl{margin:6px 0 10px}
html.ct96 .bib-corpo .alerta{border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:8px 12px;border-radius:8px;margin:8px 0}

<body>
<div class="topo"><div><h1>Módulo Contábil</h1><p class="muted" style="margin:0">Painel executivo multiempresas: disponibilidades, relatórios, Radar de Saúde e laudo técnico.</p></div><a class="btn sec sm" href="./">Voltar ao painel</a></div>
<div id="app"><div class="panel"><p class="muted" style="margin:0">Carregando o Módulo Contábil…</p></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* =====================================================================
   v13.91 · MÓDULO CONTÁBIL EXECUTIVO (contabilidade_v1391.html) — multiempresas, barra de disponibilidades, relatórios em abas
   horizontais com KPIs, Radar de Saúde Empresarial, Motor de Crítica (sugestões de ação e correção) e Laudo Técnico em PDF.
   Base: v13.86 (contabilidade.html) — fala com /api/contabil (mesma origem do painel).
   As regras ficam no servidor e no banco: partidas dobradas, lançamentos intangíveis (só estorno), período
   fechado e cadeia de conferência. Esta tela só monta os pedidos e mostra as respostas.
   Abas: Radar de Saúde · Relatórios · Lançamentos · Plano de contas · De-para do FCX · Empresas · Parâmetros.
   ===================================================================== */
const EMBED = new URLSearchParams(location.search).has('embed');
const PAI = (() => { try { return window.parent !== window && window.parent.PainelFCX ? window.parent : null; } catch (e) { return null; } })();
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = v => (Math.round((Number(v) || 0) * 10000) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const dataBR = d => (d ? String(d).slice(0, 10).split('-').reverse().join('/') : '');
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
/** "1.234,56" | "1234.56" | 1234.56 → número */
const lerValor = v => { if (typeof v === 'number') return v; const s = String(v || '').trim().replace(/\s|R\$/g, ''); if (!s) return NaN; return Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); };
const cent = v => Math.round(lerValor(v) * 100);

async function api(met, rota, corpo) {
  const r = await fetch('/api/contabil' + rota, { method: met, credentials: 'same-origin', cache: 'no-store', headers: { 'x-painel': '1', ...(corpo !== undefined ? { 'content-type': 'application/json' } : {}) }, body: corpo === undefined ? undefined : JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.erro || 'Erro ' + r.status + ' no servidor.'); e.status = r.status; e.dados = j; throw e; }
  return j;
}
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }
const falhou = e => toast(e && e.message ? e.message : String(e));
/** confirmação em dois cliques (confirm() pode ser bloqueado em molduras) */
let pend = null;
function confirmar(chave, msg) { const t = Date.now(); if (pend && pend.k === chave && t - pend.t < 6000) { pend = null; return true; } pend = { k: chave, t }; toast(msg + ' Clique de novo para confirmar.'); return false; }

/* ---------- tema: dentro do painel, copia os tokens de cor do painel (e acompanha a troca de tema) ---------- */
const TOK = ['--navy', '--accent', '--accent-soft', '--bg', '--panel', '--panel-2', '--line', '--line-soft', '--ink', '--ink-soft', '--ink-faint', '--ok', '--ok-soft', '--warn', '--warn-soft', '--bad', '--bad-soft', '--falco-tit', '--falco-ouro'];
function lum(c) { /* v13.91: hex (#19283f) ou rgb(…) — antes os dígitos do hex eram lidos como rgb e o tema escuro não era reconhecido */ const t = String(c).trim(); if (t[0] === '#') { let h = t.slice(1); if (h.length === 3) h = h.split('').map(x => x + x).join(''); if (h.length < 6) return 1; return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0); } const m = t.match(/[\d.]+/g); if (!m || m.length < 3) return 1; return (m[0] * 0.2126 + m[1] * 0.7152 + m[2] * 0.0722) / 255; }
function tema() {
  if (!PAI) return;
  try { const cs = PAI.getComputedStyle(PAI.document.documentElement), r = document.documentElement; let n = 0;
    TOK.forEach(t => { const v = cs.getPropertyValue(t).trim(); if (v) { r.style.setProperty(t, v); n++; } else r.style.removeProperty(t); });
    if (n) { r.dataset.embed = '1'; const esc_ = lum(cs.getPropertyValue('--bg').trim() || '#fff') < 0.4; r.toggleAttribute('data-escuro', esc_); r.style.colorScheme = esc_ ? 'dark' : 'light'; }
  } catch (e) { /* sem acesso ao painel: tema próprio */ }
}
if (PAI) { tema(); try { new PAI.MutationObserver(tema).observe(PAI.document.documentElement, { attributes: true }); PAI.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(tema, 50)); } catch (e) { } }
else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-escuro', '');

/* ---------- estado ---------- */
const S = {
  aba: 'radar', st: null, contas: [], erro: null, emp: 'emp_principal', empAberto: false, disp: null, radar: null, ef: null,
  pl: { busca: '', tipo: '', grupo: '', inativas: false, edit: null, sug: null, nome: '', pai: '' },
  dp: { itens: null, resumo: null, busca: '', status: '', edit: null },
  lf: null, ls: { lista: null, de: '', ate: '', conta: '', estorno: null },
  rl: { tipo: 'diario', de: '', ate: '', modelo: '', anoReforma: '', conta: '', regime: '', dados: null, cmp: null, comparar: true, carregando: false },
  pr: { lalur: null, ano: new Date().getFullYear(), integ: null },
  bib: { busca: '', cat: 'todos', abertos: new Set() },
};
const ABAS = [['radar', 'Radar de Saúde'], ['relatorios', 'Relatórios'], ['lancamentos', 'Lançamentos'], ['plano', 'Plano de contas'], ['depara', 'De-para do FCX'], ['empresas', 'Empresas'], ['parametros', 'Parâmetros']];
const KEMP = 'contabil:empresa';
try { const e = localStorage.getItem(KEMP); if (e) S.emp = e; } catch (e) { /* sem armazenamento: empresa principal */ }
const empresas = () => (S.st && S.st.empresas && S.st.empresas.length ? S.st.empresas : [{ id: 'emp_principal', razaoSocial: 'Empresa principal', principal: true, ativa: true, socios: [], contador: {}, regime: 'presumido', capitalSocial: 0 }]);
const empAtual = () => empresas().find(e => e.id === S.emp) || empresas()[0];
const qe = (extra = {}) => new URLSearchParams({ empresa: empAtual().id, ...extra });
const cnpjF = v => { const d = String(v || '').replace(/\D/g, ''); return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : (v || 'sem CNPJ'); };
const REGIME = { simples: 'Simples Nacional', presumido: 'Lucro Presumido', real: 'Lucro Real', mei: 'MEI' };
const crcTxt = c => (c && c.crc ? `${c.nome || 'Contador(a)'} · CRC ${c.crc}${c.uf && !String(c.crc).startsWith(c.uf) ? '/' + c.uf : ''}` : '');
const pode = p => !!(S.st && S.st.permissoes && S.st.permissoes.includes(p));
const cat = () => (S.st && S.st.catalogo) || { grupos: {}, dre: {}, dva: {}, tributosAtuais: [], tributosReforma: [], outrosTributos: [] };
const porCodigo = () => new Map(S.contas.map(c => [c.codigo, c]));
const analiticas = () => S.contas.filter(c => c.tipo === 'A' && c.ativa);
function novoLanc() { return { data: hoje(), historico: '', docRef: '', itens: [{ conta: '', dc: 'D', valor: '', historico: '' }, { conta: '', dc: 'C', valor: '', historico: '' }] }; }
S.lf = novoLanc();
{ const a = new Date().getFullYear(); S.ls.de = S.rl.de = `${a}-01-01`; S.ls.ate = S.rl.ate = `${a}-12-31`; }
async function carregarDisp() { try { S.disp = await api('GET', '/disponibilidades?' + qe({ de: S.rl.de, ate: S.rl.ate })); } catch (e) { S.disp = { erro: e.message }; } }
async function carregarRadar() { S.radar = null; render(); try { S.radar = await api('GET', '/radar?' + qe({ de: S.rl.de, ate: S.rl.ate })); } catch (e) { S.radar = { erro: e.message }; } render(); }
/** troca de empresa ou de período: tudo o que depende dela é recarregado */
async function aoMudarContexto() { S.disp = null; S.radar = null; S.rl.dados = null; S.rl.cmp = null; S.ls.lista = null; render(); await carregarDisp(); render(); await irAba(S.aba, true); }

async function carregarBase() {
  S.st = await api('GET', '');
  S.contas = S.st.plano.criado ? (await api('GET', '/contas')).contas : [];
}
async function carregarDepara() { const j = await api('GET', '/depara'); S.dp.itens = j.itens; S.dp.resumo = j.resumo; }
async function carregarLancs() { const p = qe({ de: S.ls.de, ate: S.ls.ate, limite: '1000' }); if (S.ls.conta) p.set('conta', S.ls.conta); S.ls.lista = (await api('GET', '/lancamentos?' + p)).lancamentos; }
function avisarFCX() { try { PAI && PAI.PainelFCX.planoAlterado && PAI.PainelFCX.planoAlterado(); } catch (e) { } }

async function irAba(a, forcar = false) {
  if (!ABAS.some(x => x[0] === a)) return;
  S.aba = a; render();
  try {
    if (a === 'radar' && S.st.plano.criado && (!S.radar || forcar)) await carregarRadar();
    if (a === 'relatorios' && S.st.plano.criado && !S.rl.dados && !S.rl.carregando && (S.rl.tipo !== 'razao' || S.rl.conta)) await acoes['rl-gerar']();
    if (a === 'depara' && !S.dp.itens) { await carregarDepara(); render(); }
    if (a === 'lancamentos' && !S.ls.lista) { await carregarLancs(); render(); }
    if (a === 'parametros' && !S.pr.lalur) { S.pr.lalur = (await api('GET', '/lalur?ano=' + S.pr.ano)).ajustes; render(); }
  } catch (e) { falhou(e); }
}

/* ---------- desenho ---------- */
function render() {
  const app = $('#app'), at = document.activeElement, id = at && at.id, sel = at && 'selectionStart' in at ? [at.selectionStart, at.selectionEnd] : null;
  if (S.erro) { app.innerHTML = `<div class="panel"><h2>Módulo Contábil indisponível</h2><p>${esc(S.erro)}</p><button class="btn sec" data-a="recarregar">Tentar de novo</button></div>`; return; }
  if (!S.st) return;
  const st = S.st, ro = !['contabil.lancar', 'contabil.plano', 'contabil.estornar', 'contabil.parametros'].some(pode);
  const corpo = { radar: vRadar, plano: vPlano, depara: vDepara, lancamentos: vLancamentos, relatorios: vRelatorios, empresas: vEmpresas, parametros: vParametros, biblioteca: vBiblioteca }[S.aba]();
  app.innerHTML = `${vTopo()}<div class="tabs no-print" role="tablist" aria-label="Seções do Módulo Contábil">${ABAS.map(([k, r]) => `<button role="tab" id="tab-${k}" aria-selected="${S.aba === k}" data-a="aba" data-v="${k}">${r}${k === 'depara' && st.depara && st.depara.pendente ? ` <span class="pill warn">${st.depara.pendente}</span>` : ''}</button>`).join('')}</div>
    <p class="hint no-print" style="margin:-4px 0 10px">Empresa ativa: <b>${esc(empAtual().nomeFantasia || empAtual().razaoSocial)}</b> · ${st.plano.criado ? `Plano: <b>${st.plano.contas}</b> contas (${st.plano.analiticas} analíticas)` : 'Plano de contas ainda não criado'} · <b>${st.lancamentos.total}</b> lançamento(s) · Regime: <b>${st.parametros.regime === 'real' ? 'Lucro Real' : 'Lucro Presumido'}</b> · DRE padrão: <b>${st.parametros.dreModelo === 'reforma' ? 'Nova Reforma' : 'Modelo Atual'}</b>${st.parametros.fechadoAte ? ` · período fechado até ${dataBR(st.parametros.fechadoAte)}` : ''}${ro ? ' · <span class="pill">somente consulta</span>' : ''}</p>
    <section role="tabpanel" aria-labelledby="tab-${S.aba}">${corpo}</section>
    <datalist id="dlA">${analiticas().map(c => `<option value="${esc(c.codigo)}">${esc(c.nome)}</option>`).join('')}</datalist>
    <datalist id="dlS">${S.contas.filter(c => c.tipo === 'S' && c.ativa).map(c => `<option value="${esc(c.codigo)}">${esc(c.nome)}</option>`).join('')}</datalist>${CT96() ? `<datalist id="dlP">${analiticas().map(c => `<option value="${esc(contaRot(c.codigo, c.nome))}"></option>`).join('')}</datalist>` : ''}`;
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { } } }
}

/* ---------- v13.91 · barra de disponibilidades (tempo real) e card da empresa ativa ---------- */
function vTopo() {
  const D = S.disp, e = empAtual(), esq = '<div class="dcard esq"><span class="dt">&nbsp;</span><b></b><span class="dm">&nbsp;</span></div>';
  const cards = !D ? esq.repeat(4) : D.erro ? `<div class="dcard" style="grid-column:1/-1"><span class="dt">Disponibilidades</span><span class="dm">${esc(D.erro)}</span></div>`
    : D.cards.map(c => `<div class="dcard" data-disp="${c.id}"><span class="dt" title="${esc(c.rotulo)} (${c.conta})">${esc(c.rotulo)} · <span class="mono">${c.conta}</span></span><b class="${c.saldo < 0 ? 'neg' : ''}">${fmt(c.saldo)}</b><span class="dm"><span>↑ ${esc(c.rotuloEntrada)} ${fmt(c.entradas)}</span><span>↓ ${esc(c.rotuloSaida)} ${fmt(c.saidas)}</span></span></div>`).join('')
      + `<div class="dcard tot" data-disp="consolidado"><span class="dt">Total consolidado circulante</span><b class="${D.consolidado < 0 ? 'neg' : ''}">${fmt(D.consolidado)}</b><span class="dm"><span>Disponibilidades ${fmt(D.disponivel)}</span><span>Estoques ${fmt(D.estoques)}</span></span></div>`;
  const es = D && D.escrituracao, ativas = empresas().filter(x => x.ativa !== false);
  const emp = `<details class="empcard no-print" id="empCard" ${S.empAberto ? 'open' : ''}><summary><span class="emp-ic" aria-hidden="true">${esc((e.nomeFantasia || e.razaoSocial || '?').trim().slice(0, 1).toUpperCase())}</span>
      <span><span class="emp-nome">${esc(e.razaoSocial)}</span><span class="emp-sub"> · CNPJ ${esc(cnpjF(e.cnpj))} · ${esc(REGIME[e.regime] || e.regime || '')}${crcTxt(e.contador) ? ' · ' + esc(crcTxt(e.contador)) : ''}</span></span>
      <span class="pill info">Empresa ativa</span></summary>
    <div class="emp-corpo"><div>
      ${ativas.length > 1 ? `<div class="campo" style="margin-bottom:10px"><span>Trocar de empresa</span><div class="seg" role="radiogroup" aria-label="Empresa ativa">${ativas.map(x => `<button class="${x.id === e.id ? 'on' : ''}" role="radio" aria-checked="${x.id === e.id}" data-a="emp-sel" data-v="${esc(x.id)}">${esc(x.nomeFantasia || x.razaoSocial)}</button>`).join('')}</div></div>` : ''}
      <div class="atalhos">
        <button class="atalho" data-a="emp-lancar"><b>Efetuar lançamentos</b><span>Partidas dobradas, nesta empresa</span></button>
        <button class="atalho" data-a="emp-ver"><b>Ver lançamentos</b><span>Lista do período, com estorno</span></button>
        <button class="atalho" data-a="emp-socios"><b>Quadro de sócios (QSA)</b><span>${(e.socios || []).length} sócio(s) · capital ${fmt(e.capitalSocial)}</span></button>
        <button class="atalho" data-a="emp-escr"><b>Resumo da escrituração</b><span>Σ Débitos × Σ Créditos e integridade</span></button></div></div>
      <div class="escr"><b style="display:block;margin-bottom:6px">Resumo da escrituração · ${dataBR(S.rl.de)} a ${dataBR(S.rl.ate)}</b>
        ${es ? `<div class="row"><span>Lançamentos</span><b>${es.lancamentos}</b></div><div class="row"><span>Σ Débitos</span><b>${fmt(es.debitos)}</b></div><div class="row"><span>Σ Créditos</span><b>${fmt(es.creditos)}</b></div>
        <div class="row"><span>Situação</span>${es.confere ? '<span class="pill ok">Σ D = Σ C</span>' : `<span class="pill bad">Diferença ${fmt(es.debitos - es.creditos)}</span>`}</div>` : '<span class="hint">Carregando…</span>'}

    { id: 'cpc00', cat: 'contabil', tag: 'CPC 00 (R2)', titulo: 'Estrutura Conceitual para Relatório Financeiro',

<p>O CPC 00 (R2) é a base da contabilidade: define o que é ativo, passivo, patrimônio líquido, receita e despesa e quais qualidades a informação contábil precisa ter. Todos os outros CPCs partem dele.</p>
<h4>Os cinco elementos, com exemplos da loja</h4>
<ul>
<li><b>Ativo</b>: recurso controlado pela empresa, resultado de fatos passados, que deve gerar benefícios futuros. Ex.: caixa, bancos, vendas no cartão a receber, estoque de calçados, móveis e vitrines, benfeitorias da loja.</li>

<p>Todo fato contábil é registrado com pelo menos um débito e um crédito de valores iguais; por isso, em qualquer lançamento, o total dos débitos é igual ao total dos créditos. Débito é o lado esquerdo da conta e crédito, o direito. O efeito depende do grupo da conta:</p>

    { id: 'cpc06', cat: 'contabil', tag: 'CPC 06 (R2)', titulo: 'Arrendamentos: aluguel de loja em shopping e na rua',

      corpo: `<h4>Em uma frase</h4>
<p>Pelo CPC 06 (R2), equivalente ao IFRS 16, quem aluga um ponto comercial por prazo determinado passa a registrar no balanço o <b>direito de usar a loja</b> (ativo) e a <b>obrigação de pagar os aluguéis</b> (passivo), em vez de lançar o aluguel apenas como despesa do mês.</p>
<h4>Quando se aplica</h4>
<ul>
<li>Contrato que dá à empresa o direito de controlar o uso de um imóvel identificado (loja, depósito, escritório) por um período, em troca de pagamento: vale para loja de shopping e para loja de rua.</li>
<li><b>Isenções práticas</b>: contratos de curto prazo (até 12 meses) e de ativos de baixo valor podem continuar como despesa linear.</li>

      corpo: `<h4>Regra de ouro</h4>
<p>O estoque fica no balanço pelo <b>menor valor entre o custo e o valor realizável líquido (VRL)</b>. O VRL é o preço estimado de venda no curso normal dos negócios menos os custos necessários para vender.</p>
<h4>O que entra no custo de aquisição do calçado</h4>

<li><b>Fica fora</b> (vai para despesa): frete e comissões da venda, armazenagem depois da compra, desperdícios e despesas administrativas e de vendas.</li>

<p>Exemplo: compra de R$ 10.000,00 com ICMS recuperável de R$ 1.200,00 destacado na nota e frete de R$ 500,00 sem crédito. Custo do estoque = 10.000,00 − 1.200,00 + 500,00 = R$ 9.300,00.</p>

<h4>Método do varejo</h4>

    { id: 'cpc27', cat: 'contabil', tag: 'CPC 27', titulo: 'Ativo imobilizado: benfeitorias em lojas alugadas e depreciação',
      resumo: 'O que ativar, benfeitorias em imóvel de terceiros, vida útil × prazo do contrato, taxas fiscais e baixa por fechamento de loja',
      chaves: 'imobilizado depreciacao benfeitoria benfeitorias loja alugada imovel de terceiros reforma obra vida util valor residual taxas receita federal moveis utensilios computadores baixa fechamento impairment manutencao reparo capitalizar equipamentos',
      corpo: `<h4>O que é imobilizado na loja</h4>
<p>Bens tangíveis usados na operação por mais de um período: móveis, expositores e vitrines, equipamentos (PDV, computadores, ar-condicionado, câmeras), veículos, instalações e <b>benfeitorias em imóveis de terceiros</b>.</p>
<h4>Ativar ou lançar como despesa?</h4>
<ul>
<li><b>Ativar</b>: preço de compra, tributos não recuperáveis e gastos para colocar o bem em uso (frete, instalação, montagem), além de reformas que ampliam a vida útil, a capacidade ou a qualidade.</li>
<li><b>Despesa</b>: manutenção e reparos rotineiros (pintura de conservação, troca de lâmpadas, conserto de prateleira) e bens de baixo valor, conforme a política de capitalização (valor mínimo) da empresa.</li>
</ul>
<h4>Benfeitorias em loja alugada</h4>
<ul>
<li>Obras de adaptação do ponto (forro, piso, fachada, instalações elétricas e hidráulicas, divisórias, marcenaria sob medida) pagas pelo inquilino são ativo imobilizado, na conta “Benfeitorias em imóveis de terceiros”.</li>
<li><b>Prazo de depreciação</b>: o menor entre a vida útil econômica da benfeitoria e o prazo do contrato de aluguel (incluindo renovações que a empresa tenha certeza razoável de exercer), porque, ao devolver o imóvel, o benefício acaba. Exemplo: obra de R$ 120.000,00 em contrato de 5 anos = R$ 2.000,00 por mês.</li>
<li><b>Shopping</b>: se o locador dá verba de obra, carência ou outro incentivo, o tratamento contábil depende do contrato e do CPC 06 (R2); consulte o contador.</li>
</ul>
<h4>Depreciação</h4>
<ul>
<li>Começa quando o bem está disponível para uso (abertura da loja) e, na maioria dos casos, é linear (existem também saldos decrescentes e unidades produzidas).</li>
<li>Vida útil, valor residual e método devem ser revistos pelo menos ao fim de cada exercício.</li>
<li><b>Contábil × fiscal</b>: a contabilidade usa a vida útil estimada (CPC 27). Para o Lucro Real, a Receita Federal tem taxas usuais (tabela de vida útil da IN SRF 162/1998): móveis e utensílios 10% ao ano, máquinas e equipamentos 10%, veículos 20%, computadores e periféricos 20% e edificações 4%. As diferenças entre a depreciação contábil e a fiscal são controladas no e-LALUR. No Lucro Presumido e no Simples Nacional, a depreciação não muda a base dos tributos.</li>
</ul>
<h4>Lançamentos-modelo</h4>
<p>Obra paga pelo inquilino e depreciação mensal (valores ilustrativos):</p>
${ex96([['D', 'g1', 'Benfeitorias em imóveis de terceiros (imobilizado)', '120.000,00'], ['C', 'g1', 'Bancos', '120.000,00'], ['D', 'g4', 'Despesa de depreciação', '2.000,00'], ['C', 'g1', '(−) Depreciação acumulada de benfeitorias', '2.000,00']])}
<h4>Fechamento ou mudança de loja</h4>
<p>Ao encerrar o contrato ou fechar a loja, baixe o saldo residual das benfeitorias (custo menos depreciação acumulada) contra o resultado, como perda na baixa. Lojas com resultado persistentemente negativo podem exigir teste de recuperabilidade (CPC 01) para reduzir o valor do imobilizado.</p>
${ex96([['D', 'g1', '(−) Depreciação acumulada de benfeitorias', '90.000,00'], ['D', 'g4', 'Perda na baixa de imobilizado (resultado)', '30.000,00'], ['C', 'g1', 'Benfeitorias em imóveis de terceiros', '120.000,00']])}
<p class="alerta">Resumo orientativo: a política de capitalização, as vidas úteis e as taxas fiscais devem ser definidas com o contador responsável.</p>` },

    { id: 'fis-cf', cat: 'fiscal', tag: 'Guia Fiscal Varejo', titulo: 'Consumidor final × Contribuinte',
      resumo: 'Quem é quem na nota fiscal, NFC-e × NF-e, DIFAL e CFOP por tipo de cliente',
      chaves: 'consumidor final contribuinte icms inscricao estadual nfc-e nf-e difal indfinal indiedest nao contribuinte cpf cnpj venda interestadual revenda lojista atacado',
      corpo: `<h4>Quem é quem</h4>

<tr><td><b>Documento</b></td><td>NFC-e (modelo 65) no balcão; NF-e (modelo 55) quando o cliente pedir, na venda a distância ou para pessoa jurídica, conforme a regra do estado.</td><td>NF-e (modelo 55) com a inscrição estadual do destinatário.</td></tr>
<tr><td><b>Campos da NF-e</b></td><td>Operação com consumidor final = 1; indicador de IE do destinatário = 9 (não contribuinte) ou 2 (isento).</td><td>Operação com consumidor final = 0; indicador de IE = 1 (contribuinte).</td></tr>

</tbody></table></div>
<h4>Pontos de atenção</h4>

<li>O DIFAL na venda a consumidor final de outro estado decorre da EC 87/2015 e da LC 190/2022 e é recolhido pelo remetente, com regras de cada estado.</li>

<p class="alerta">Regras de NFC-e, NF-e e DIFAL variam por estado: confirme no RICMS e com o contador.</p>` },

    { id: 'fis-st', cat: 'fiscal', tag: 'Guia Fiscal Varejo', titulo: 'ICMS-ST (substituição tributária)',
      resumo: 'Como a loja compra e vende mercadoria com ICMS já retido: CST/CSOSN, CFOP e custo do estoque',
      chaves: 'icms st substituicao tributaria substituido retido cest ncm cst 60 csosn 500 5.405 1.403 restituicao ressarcimento pgdas simples calcado calcados',
      corpo: `<h4>Como funciona</h4>
<p>Na substituição tributária, o fabricante, o importador ou o atacadista (substituto) recolhe antecipadamente o ICMS de toda a cadeia até o consumidor final. A loja que compra com ST (substituída) já recebe o imposto embutido no preço e, <b>na revenda daquela mercadoria, não destaca nem recolhe novamente o ICMS</b>.</p>
<p class="alerta"><b>Calçados:</b> estar ou não no regime de ST depende do estado de destino e dos protocolos e convênios entre os estados. Confira o NCM (capítulo 64) e o CEST do produto no anexo de ST do RICMS do seu estado ou com o contador; não presuma.</p>
<h4>Como lançar na loja</h4>
<div class="tbl"><table><thead><tr><th>Etapa</th><th>CFOP</th><th>Situação tributária</th></tr></thead><tbody>
<tr><td>Compra com ST retida pelo fornecedor</td><td>1.403 (mesmo estado) · 2.403 (outro estado)</td><td>CST 60 no regime normal · CSOSN 500 no Simples Nacional</td></tr>
<tr><td>Venda ao cliente</td><td>5.405 (mesmo estado) · 6.404 (outro estado, imposto já retido)</td><td>Mesmo CST 60 ou CSOSN 500; não destacar ICMS</td></tr>
<tr><td>Devolução do cliente</td><td>1.411 · 2.411</td><td>Mantém a situação da venda</td></tr>
<tr><td>Devolução ao fornecedor</td><td>5.411 · 6.411</td><td>Mantém a situação da compra</td></tr>
</tbody></table></div>
<h4>Contabilidade e tributos</h4>
<ul>
<li>O ICMS-ST pago na compra <b>integra o custo do estoque</b> (CPC 16): não é imposto recuperável.</li>
<li><b>Simples Nacional</b>: no PGDAS-D, segregue a receita de mercadorias com ICMS-ST para não pagar o ICMS duas vezes dentro do DAS.</li>
<li>Quando a mercadoria é vendida por preço menor que a base presumida na ST, o STF (RE 593.849, 2016) reconheceu o direito à restituição da diferença; o procedimento varia por estado e deve ser conduzido pelo contador.</li>
<li>Confira sempre o CST/CSOSN e o valor de ICMS-ST na nota de entrada: mercadoria sujeita à ST recebida sem a retenção pode gerar recolhimento pela loja.</li>
</ul>
<p class="alerta">Regras de ST (produtos, margens de valor agregado, benefícios) mudam com frequência e variam por estado: confirme antes de aplicar.</p>` },

    { id: 'fis-pc', cat: 'fiscal', tag: 'Guia Fiscal Varejo', titulo: 'PIS/COFINS monofásico e calçados',
      resumo: 'Calçados não são monofásicos; itens monofásicos na loja; regimes cumulativo e não cumulativo; calendário da Reforma Tributária',
      chaves: 'pis cofins monofasico monofasica calcado calcados ncm 64 aliquota zero cst 04 perfumaria higiene cosmeticos cumulativo nao cumulativo lucro presumido lucro real simples reforma tributaria cbs ibs 2026 2027 2033 lc 214 transicao',
      corpo: `<p class="alerta"><b>Atenção:</b> calçados (NCM do capítulo 64) <b>não estão no regime monofásico</b> de PIS/COFINS. Na loja de calçados, PIS e COFINS incidem normalmente sobre a receita da revenda. Não classifique calçado como “monofásico” para tirar a receita do cálculo.</p>
<h4>O que é o regime monofásico</h4>
<p>A tributação de PIS/COFINS é concentrada no fabricante ou importador (com alíquotas maiores) e a revenda, no atacado e no varejo, sai com alíquota zero (CST 04 na nota). A lista é por produto (NCM) e fixada em lei: por exemplo, combustíveis, medicamentos, perfumaria, higiene pessoal e cosméticos (Lei 10.147/2000), autopeças, pneus, veículos e bebidas frias.</p>
<h4>O que fazer na loja</h4>
<ul>
<li>Revise o cadastro de produtos item a item pelo NCM: se a loja vende cosméticos, produtos de higiene ou outros itens da lista, a receita deles pode ser separada (alíquota zero na revenda). O calçado e as demais mercadorias seguem a regra geral.</li>
<li><b>Lucro Presumido</b>: PIS 0,65% e COFINS 3% (cumulativo) sobre a receita, sem crédito nas compras.</li>
<li><b>Lucro Real</b>: PIS 1,65% e COFINS 7,6% (não cumulativo), com crédito sobre compras e despesas permitidas.</li>
<li><b>Simples Nacional</b>: PIS e COFINS fazem parte do DAS; havendo receita monofásica, ela é segregada no PGDAS-D para excluir esses tributos daquela parcela.</li>
</ul>
<h4>Reforma Tributária: calendário</h4>
<ul>
<li><b>2026 (ano de teste)</b>: destaque de CBS 0,9% e IBS 0,1% nos documentos fiscais, com compensação prevista com tributos já devidos, sem aumento da carga efetiva neste ano. Acompanhe as regras do seu regime.</li>
<li><b>2027</b>: PIS e COFINS são substituídos pela CBS.</li>
<li><b>2029 a 2032</b>: ICMS e ISS diminuem gradualmente e o IBS cresce. <b>2033</b>: ICMS e ISS são extintos. Base legal: Emenda Constitucional 132/2023 e Lei Complementar 214/2025.</li>
</ul>
<p class="alerta">Durante a transição, o tratamento de ST e de monofásico também muda. Confirme as regras vigentes com o contador e a SEFAZ do seu estado.</p>` },

function vBiblioteca() {
  const B = S.bib, todos = bibCartoes(), toks = norm96(B.busca).split(/\s+/).filter(Boolean);
  const lista = todos.filter(c => (B.cat === 'todos' || c.cat === B.cat) && toks.every(t => c.palha.includes(t)));
  const auto = toks.length > 0 && lista.length <= 3, aberto = c => auto || B.abertos.has(c.id);
  const chip = (k, r) => `<button class="${B.cat === k ? 'on' : ''}" data-a="bib-cat" data-v="${k}" aria-pressed="${B.cat === k}">${r}</button>`;
  const card = c => `<details class="bib-card ${c.cat}" data-bib="${c.id}" ${auto ? 'data-auto="1"' : ''} ${aberto(c) ? 'open' : ''}><summary><span class="pill ${c.cat === 'fiscal' ? 'warn' : 'info'}">${CAT_BIB[c.cat]}</span><span class="pill">${esc(c.tag)}</span><span class="bib-tit">${esc(c.titulo)}</span><span class="bib-res">${esc(c.resumo)}</span></summary><div class="bib-corpo">${c.corpo}</div></details>`;
  const todosAbertos = lista.length > 0 && lista.every(aberto);
  return `<div class="panel"><h2>Biblioteca CPC &amp; Regras Fiscais</h2>
    <p class="hint" style="margin:0 0 6px">Resumos práticos, em linguagem de loja, sobre os pronunciamentos do CPC e as regras fiscais mais comuns no varejo de calçados (lojas de rua e de shopping). Busque por palavra-chave ou filtre por categoria e abra o cartão para ler.</p>
    <div class="bib-barra no-print"><label class="campo"><span>Buscar</span><input id="bib-busca" type="search" value="${esc(B.busca)}" placeholder="Ex.: aluguel, estoque, ICMS-ST, 5.102, depreciação" autocomplete="off"></label>
      <div><span class="hint" style="display:block;margin-bottom:2px">Categoria</span><div class="seg" role="group" aria-label="Filtrar por categoria">${chip('todos', 'Todos')}${chip('contabil', 'Contábil (CPC)')}${chip('fiscal', 'Fiscal')}</div></div>
      <button class="btn sec sm" data-a="bib-todos" data-v="${todosAbertos ? 'fechar' : 'abrir'}" ${lista.length ? '' : 'disabled'}>${todosAbertos ? 'Recolher todos' : 'Expandir todos'}</button></div>
    <p class="hint" id="bib-cont" aria-live="polite" style="margin:0 0 8px">${lista.length} de ${todos.length} cartões${B.busca.trim() ? ' para “' + esc(B.busca.trim()) + '”' : ''}</p>
    ${lista.length ? lista.map(card).join('') : '<div class="bib-vazio">Nenhum cartão encontrado. Tente outra palavra (por exemplo: aluguel, estoque, depreciação, ICMS, CFOP) ou mude a categoria.</div>'}
    <p class="note" style="margin-top:12px"><b>Conteúdo orientativo.</b> Os resumos não substituem os pronunciamentos do CPC, a legislação vigente (federal, estadual e municipal) nem a orientação do contador responsável. Alíquotas, benefícios e regras de substituição tributária variam por estado e mudam com frequência: confirme sempre antes de aplicar. Revisão do conteúdo: novembro de 2026.</p></div>`;
}


/* ---------- aba: plano de contas ---------- */
function vPlano() {
  const st = S.st;
  if (!st.plano.criado) return `<div class="panel"><h2>O plano de contas ainda não foi criado</h2>
    <p>O ponto de partida combinado é <b>importar as contas que o FCX já usa</b>: o Módulo Contábil cria o plano padrão (comércio varejista, 184 contas com as da Reforma — IBS, CBS e Imposto Seletivo), liga cada conta do FCX a uma conta do plano (de-para) e completa o que faltar.</p>
    <div class="row">${pode('contabil.plano') ? '<button class="btn" data-a="importar-fcx">Importar contas do FCX</button>' : ''}${pode('contabil.parametros') ? '<button class="btn sec" data-a="plano-padrao">Só criar o plano padrão</button>' : ''}${!pode('contabil.plano') && !pode('contabil.parametros') ? '<p class="muted">Peça a quem gerencia o plano de contas (Gestão de Acessos › Contabilidade · Modificar).</p>' : ''}</div></div>`;
  const P = S.pl, q = P.busca.toLowerCase().trim(), mapa = porCodigo(), c = cat();
  const lista = S.contas.filter(x => (P.inativas || x.ativa) && (!P.tipo || x.tipo === P.tipo) && (!P.grupo || String(x.grupo) === P.grupo) && (!q || x.codigo.startsWith(q) || x.nome.toLowerCase().includes(q)));
  const linhas = lista.map(x => {
    const ed = P.edit === x.codigo;
    const row = `<tr class="${x.tipo === 'S' ? 'sint' : ''} ${x.ativa ? '' : 'inativa'}"><td class="mono">${esc(x.codigo)}</td><td class="ind${Math.min(5, x.nivel - 1)}">${esc(x.nome)}${x.redutora ? ' <span class="pill">retificadora</span>' : ''}</td><td>${x.tipo === 'S' ? 'Sintética' : 'Analítica'}</td><td>${nat(x.natureza)}</td><td>${x.dre ? esc(c.dre[x.dre] || x.dre) : '<span class="muted">—</span>'}</td><td>${x.tributos.length ? x.tributos.map(t => `<span class="pill ${c.tributosReforma.includes(t) ? 'info' : ''}">${esc(t)}</span>`).join(' ') : '<span class="muted">—</span>'}</td><td class="no-print">${pode('contabil.plano') ? `<button class="btn sec sm" data-a="pl-editar" data-v="${esc(x.codigo)}" aria-expanded="${ed}">${ed ? 'Fechar' : 'Editar'}</button>` : ''}</td></tr>`;
    if (!ed) return row;
    const g = x.grupo >= 4;
    return row + `<tr class="edit-row"><td colspan="7"><div class="row">
      <label class="campo" style="flex:2 1 260px"><span>Nome</span><input id="pe-nome" value="${esc(x.nome)}"></label>
      <label class="campo"><span>Tipo</span><select id="pe-tipo">${opts([['A', 'Analítica'], ['S', 'Sintética']], x.tipo)}</select></label>
      ${g ? `<label class="campo"><span>Linha da DRE</span><select id="pe-dre"><option value="">—</option>${opts(Object.entries(c.dre), x.dre)}</select></label><label class="campo"><span>Linha da DVA</span><select id="pe-dva"><option value="">—</option>${opts(Object.entries(c.dva), x.dva)}</select></label>` : ''}
      <label class="campo"><span>Situação</span><select id="pe-ativa">${opts([['1', 'Ativa'], ['0', 'Inativa']], x.ativa ? '1' : '0')}</select></label></div>
      <div style="margin:8px 0"><span class="hint">Vínculo tributário: </span>${tribChecks(x.tributos, 'pe')}</div>
      <div class="row"><button class="btn sm" data-a="pl-salvar" data-v="${esc(x.codigo)}">Salvar</button><button class="btn sec sm" data-a="pl-editar" data-v="">Cancelar</button><button class="btn danger sm" data-a="pl-excluir" data-v="${esc(x.codigo)}">Excluir (só sem lançamentos)</button>
      <span class="hint">Código, grupo e conta-mãe não mudam. Natureza e tipo travam depois do primeiro lançamento.</span></div></td></tr>`;
  }).join('');
  const sug = P.sug;
  const nova = pode('contabil.plano') ? `<details class="panel no-print" id="plNova" ${sug || P.nome ? 'open' : ''}><summary>+ Nova conta (com classificação automática)</summary>
    <p class="hint" style="margin-top:6px">Digite o nome: a classificação automática sugere grupo, natureza, tipo (sintética/analítica), conta-mãe, código, linhas da DRE/DVA e o vínculo tributário (modelo atual ICMS/PIS/COFINS/ISS ou Reforma IBS/CBS/IS). Confira e ajuste antes de criar.</p>
    <div class="row"><label class="campo" style="flex:2 1 280px"><span>Nome da conta</span><input id="pn-nome" value="${esc(P.nome)}" placeholder="Ex.: Aluguel a Pagar, Banco Conta Movimento 2, (-) IBS sobre Vendas"></label>
      <label class="campo" style="flex:1 1 220px"><span>Conta-mãe (opcional)</span><select id="pn-pai"><option value="">— deixar a classificação sugerir —</option>${S.contas.filter(x => x.tipo === 'S' && x.ativa).map(x => `<option value="${esc(x.codigo)}" ${P.pai === x.codigo ? 'selected' : ''}>${esc(x.codigo)} · ${esc(x.nome)}</option>`).join('')}</select></label>
      <button class="btn sec" data-a="pn-sugerir">Sugerir classificação</button></div>
    ${sug ? `<div class="note" style="margin-top:10px"><b>Sugestão (confiança ${Math.round(sug.confianca * 100)}%):</b> ${esc(sug.grupo + ' · ' + sug.grupoNome)} · ${nat(sug.natureza)} · ${sug.tipo === 'S' ? 'Sintética' : 'Analítica'}${sug.redutora ? ' · retificadora' : ''} · mãe ${esc(sug.pai || '—')}<br><span class="hint">${esc(sug.motivos.join(' · '))}</span></div>
      <div class="row"><label class="campo"><span>Código</span><input id="pn-codigo" value="${esc(sug.codigo || '')}" class="mono" style="width:150px"></label>
        <label class="campo"><span>Tipo</span><select id="pn-tipo">${opts([['A', 'Analítica'], ['S', 'Sintética']], sug.tipo)}</select></label>
        <label class="campo"><span>Retificadora</span><select id="pn-red">${opts([['0', 'Não'], ['1', 'Sim (natureza oposta)']], sug.redutora ? '1' : '0')}</select></label>
        ${sug.grupo >= 4 ? `<label class="campo"><span>Linha da DRE</span><select id="pn-dre"><option value="">—</option>${opts(Object.entries(c.dre), sug.dre)}</select></label><label class="campo"><span>Linha da DVA</span><select id="pn-dva"><option value="">—</option>${opts(Object.entries(c.dva), sug.dva)}</select></label>` : ''}</div>
      <div style="margin:8px 0"><span class="hint">Vínculo tributário: </span>${tribChecks(sug.tributos, 'pn')}</div>
      <div class="row"><button class="btn" data-a="pn-criar">Criar conta</button><button class="btn sec" data-a="pn-limpar">Descartar</button></div>` : ''}</details>` : '';
  return `${nova}<div class="panel"><div class="row between no-print" style="margin-bottom:10px"><div class="row">
      <label class="campo"><span>Buscar</span><input id="pl-busca" type="search" value="${esc(P.busca)}" placeholder="Código ou nome" aria-label="Buscar conta"></label>
      <label class="campo"><span>Tipo</span><select id="pl-tipo">${opts([['', 'Todas'], ['S', 'Sintéticas'], ['A', 'Analíticas']], P.tipo)}</select></label>
      <label class="campo"><span>Grupo</span><select id="pl-grupo"><option value="">Todos</option>${opts(Object.entries(c.grupos).map(([k, g]) => [k, k + ' · ' + g.nome]), P.grupo)}</select></label>
      <label style="display:flex;gap:6px;align-items:center;padding-bottom:8px"><input type="checkbox" id="pl-inativas" ${P.inativas ? 'checked' : ''}> Mostrar inativas</label></div>
      <span class="hint">${lista.length} conta(s)</span></div>
    <div class="tbl"><table><thead><tr><th>Código</th><th>Conta</th><th>Tipo</th><th>Natureza</th><th>DRE</th><th>Tributos</th><th class="no-print"><span class="sr">Ações</span></th></tr></thead><tbody>${linhas || '<tr><td colspan="7" class="vazio">Nenhuma conta com esse filtro.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- aba: de-para do FCX ---------- */
const ST_DP = { automatico: ['ok', 'Automático'], revisado: ['info', 'Revisado'], pendente: ['warn', 'Pendente'] };
function vDepara() {
  if (!S.dp.itens) return '<div class="panel"><p class="muted" style="margin:0">Carregando o de-para…</p></div>';
  const D = S.dp, r = D.resumo, q = D.busca.toLowerCase().trim(), gerir = pode('contabil.plano');
  const lista = D.itens.filter(x => (!D.status || (D.status === 'agrupador' ? x.agrupador : D.status === 'inativa' ? !x.ativa : D.status === 'contabil' ? x.fonte === 'contabil' : x.status === D.status && !x.agrupador)) && (!q || x.chave.toLowerCase().includes(q) || (x.conta || '').startsWith(q) || (x.contaNome || '').toLowerCase().includes(q)));
  const auto = D.itens.filter(x => x.status === 'automatico' && x.ativa && x.conta);
  const linhas = lista.map(x => {
    const s = x.agrupador ? ['', 'Agrupador'] : ST_DP[x.status] || ST_DP.pendente, ed = D.edit === x.chave;
    const cont = ed ? `<div class="row"><input id="dp-conta" list="${x.agrupador ? 'dlS' : 'dlA'}" value="${esc(x.conta || '')}" class="mono" style="width:150px" aria-label="Conta contábil para ${esc(x.chave)}"><button class="btn sm" data-a="dp-salvar" data-v="${esc(x.chave)}">Salvar</button><button class="btn sec sm" data-a="dp-editar" data-v="">Cancelar</button></div><span class="hint">${x.agrupador ? 'Agrupador do ERP: escolha uma conta sintética.' : 'Recebe lançamentos: escolha uma conta analítica.'}</span>`
      : x.conta ? `<span class="mono"><b>${esc(x.conta)}</b></span> · ${esc(x.contaNome || '')}` : '<span class="muted">— sem conta —</span>';
    const acoes = gerir ? `${!ed ? `<button class="btn sec sm" data-a="dp-editar" data-v="${esc(x.chave)}">Alterar</button>` : ''}${x.status !== 'revisado' && x.conta && !ed ? ` <button class="btn sm" data-a="dp-confirmar" data-v="${esc(x.chave)}">Confirmar</button>` : ''} <button class="btn sec sm" data-a="dp-ativa" data-v="${esc(x.chave)}">${x.ativa ? 'Inativar' : 'Reativar'}</button>` : '';
    return `<tr class="${x.agrupador ? 'sint' : ''} ${x.ativa ? '' : 'inativa'}"><td>${esc(x.chave)}${x.fonte === 'contabil' ? ' <span class="pill info">do Contábil</span>' : ''}</td><td>${cont}</td><td><span class="pill ${s[0]}">${s[1]}</span></td><td class="num">${x.confianca == null ? '—' : Math.round(x.confianca * 100) + '%'}</td><td class="hint">${esc(x.motivo || '')}</td><td class="no-print" style="white-space:nowrap">${acoes}</td></tr>`;
  }).join('');
  return `<div class="panel"><div class="row between"><div><h2>De-para do FCX → plano de contas</h2><p class="hint" style="margin:0;max-width:820px">O FCX não cadastra mais contas: a lista dele vem daqui, em modo consulta. Cada conta do FCX (rótulo do ERP, que o painel analítico e a DFC continuam usando) aponta para uma conta do plano único. Os agrupadores do ERP apontam para a sintética correspondente. <b>Pendente</b> = a regra não teve confiança suficiente: confira e confirme.</p></div>
      <div class="row no-print">${gerir ? `<button class="btn" data-a="importar-fcx">Importar contas do FCX</button>${auto.length ? `<button class="btn sec" data-a="dp-confirmar-todos">Confirmar os ${auto.length} automáticos</button>` : ''}` : ''}</div></div>
    <div class="chips">${[['', 'Todas', r.total], ['pendente', 'Pendentes', r.pendente], ['automatico', 'Automáticas', r.automatico], ['revisado', 'Revisadas', r.revisado], ['agrupador', 'Agrupadores', r.agrupadores], ['contabil', 'Criadas no Contábil', r.doContabil], ['inativa', 'Inativas', r.inativas]].map(([k, t, n]) => `<button class="btn ${D.status === k ? '' : 'sec'} sm" data-a="dp-filtro" data-v="${k}" aria-pressed="${D.status === k}">${t} · ${n}</button>`).join('')}</div>
    ${gerir ? `<details class="no-print" style="margin-bottom:10px"><summary>+ Conta nova para o FCX</summary><div class="row" style="margin-top:8px"><label class="campo" style="flex:2 1 300px"><span>Conta do FCX (com o código do ERP)</span><input id="dp-novo" placeholder="Ex.: 4.10.17 – (-) Nova despesa de ocupação"></label><label class="campo"><span>Conta contábil (opcional)</span><input id="dp-novo-conta" list="dlA" class="mono" style="width:150px" placeholder="sugestão automática"></label><button class="btn" data-a="dp-criar">Criar para o FCX</button></div><p class="hint">Sem conta contábil, a regra do ERP sugere; sem código do ERP, a classificação pelo nome sugere e fica pendente.</p></details>` : ''}
    <div class="row no-print" style="margin-bottom:10px"><label class="campo"><span>Buscar</span><input id="dp-busca" type="search" value="${esc(D.busca)}" placeholder="Conta do FCX ou conta contábil" style="width:300px"></label><span class="hint" style="padding-bottom:8px">${lista.length} de ${r.total}</span></div>
    <div class="tbl"><table><thead><tr><th>Conta do FCX</th><th>Conta contábil</th><th>Situação</th><th class="num">Confiança</th><th>Motivo</th><th class="no-print"><span class="sr">Ações</span></th></tr></thead><tbody>${linhas || `<tr><td colspan="6" class="vazio">${r.total ? 'Nenhuma conta com esse filtro.' : 'Nada importado ainda: use “Importar contas do FCX”.'}</td></tr>`}</tbody></table></div></div>`;
}

/* ---------- aba: lançamentos ---------- */
function totaisLanc() { let d = 0, c = 0; S.lf.itens.forEach(i => { const v = cent(i.valor); if (v > 0) { if (i.dc === 'D') d += v; else c += v; } }); return { d, c }; }
function lancValido() {
  const f = S.lf, m = porCodigo(), { d, c } = totaisLanc(), prob = [];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.data)) prob.push('data');
  if (f.historico.trim().length < 3) prob.push('histórico');
  const us = f.itens.filter(i => i.conta || i.valor);
  if (us.length < 2) prob.push('ao menos duas partidas');
  us.forEach((i, k) => { const x = m.get(i.conta.trim()); if (!x) prob.push(`conta da partida ${k + 1}`); else if (x.tipo !== 'A' || !x.ativa) prob.push(`partida ${k + 1}: conta sintética ou inativa`); if (!(cent(i.valor) > 0)) prob.push(`valor da partida ${k + 1}`); });
  if (!d || !c) prob.push('um débito e um crédito');
  if (d !== c) prob.push('débitos = créditos');
  return { ok: !prob.length, prob, d, c };
}
function htmlTotais() { const v = lancValido(), dif = v.d - v.c; return `<span>Débitos: ${fmt(v.d / 100)}</span><span>Créditos: ${fmt(v.c / 100)}</span><span class="${dif ? 'dif' : 'ok'}">${dif ? 'Diferença: ' + fmt(Math.abs(dif) / 100) : (CT96() ? '✓ Partidas dobradas: Débito = Crédito' : '✓ Partidas dobradas: D = C')}</span>${v.ok ? '' : `<span class="hint" style="font-weight:400">Falta: ${esc([...new Set(v.prob)].slice(0, 4).join(', '))}</span>`}`; }
function atualizarTotais() { const t = $('#lf-tot'); if (t) t.innerHTML = htmlTotais(); const b = $('#lf-gravar'); if (b) b.disabled = !lancValido().ok; }
function vLancamentos() {
  const f = S.lf, L = S.ls, m = porCodigo();
  if (!S.st.plano.criado) return '<div class="panel"><p style="margin:0">Crie o plano de contas antes de lançar (aba Plano de contas).</p></div>';
  const form = pode('contabil.lancar') ? `<div class="panel no-print"><h2>Novo lançamento (partidas dobradas)</h2>${CT96() ? legenda96() : ''}
    <div class="row"><label class="campo"><span>Data</span><input type="date" id="lf-data" value="${esc(f.data)}"></label><label class="campo" style="flex:3 1 320px"><span>Histórico</span><input id="lf-hist" value="${esc(f.historico)}" placeholder="Ex.: Compra de mercadorias NF 1234"></label><label class="campo" style="flex:1 1 140px"><span>Documento (opcional)</span><input id="lf-doc" value="${esc(f.docRef)}"></label></div>
    <div style="margin-top:10px">${CT96() ? cab96() : ''}${f.itens.map((i, k) => { const x = m.get(i.conta.trim()); if (CT96()) return linha96(i, k, x); return `<div class="lin-lanc"><input data-li="${k}" data-f="conta" list="dlA" value="${esc(i.conta)}" class="mono" placeholder="Conta analítica" aria-label="Conta da partida ${k + 1}" title="${esc(x ? x.nome : '')}"><select data-li="${k}" data-f="dc" aria-label="Débito ou crédito da partida ${k + 1}">${opts([['D', 'D'], ['C', 'C']], i.dc)}</select><input data-li="${k}" data-f="valor" value="${esc(i.valor)}" inputmode="decimal" placeholder="0,00" style="text-align:right" aria-label="Valor da partida ${k + 1}"><span class="hint opc">${esc(x ? x.nome : i.conta ? 'conta não encontrada' : '')}</span><input class="opc" data-li="${k}" data-f="historico" value="${esc(i.historico)}" placeholder="Histórico da partida (opcional)" aria-label="Histórico da partida ${k + 1}"><button class="btn sec sm" data-a="lf-tirar" data-v="${k}" aria-label="Remover partida ${k + 1}" ${f.itens.length <= 2 ? 'disabled' : ''}>×</button></div>`; }).join('')}</div>
    <div class="row"><button class="btn sec sm" data-a="lf-mais">+ partida</button></div>
    <div class="tot-lanc" id="lf-tot" aria-live="polite">${htmlTotais()}</div>
    <div class="row"><button class="btn" id="lf-gravar" data-a="lf-gravar" ${lancValido().ok ? '' : 'disabled'}>Gravar lançamento</button><button class="btn sec" data-a="lf-limpar">Limpar</button><span class="hint">Depois de gravado, o lançamento não se altera nem se exclui: correções são feitas por estorno (ligado ao original).</span></div></div>` : '';
  const lista = L.lista ? [...L.lista].reverse() : null;
  const linhas = lista ? lista.map(l => {
    const sit = l.estornoDe ? `<span class="pill info">Estorno do nº ${esc((L.lista.find(x => x.id === l.estornoDe) || {}).numero || '')}</span>` : l.estornadoPor ? '<span class="pill warn">Estornado</span>' : l.origem === 'encerramento' ? '<span class="pill">Encerramento</span>' : '';
    const est = L.estorno === l.id ? `<tr class="edit-row"><td colspan="6"><div class="row"><label class="campo" style="flex:2 1 300px"><span>Motivo do estorno</span><input id="le-motivo" placeholder="Ex.: valor digitado errado"></label><label class="campo"><span>Data do estorno</span><input type="date" id="le-data" value="${hoje()}"></label><button class="btn danger" data-a="le-confirmar" data-v="${esc(l.id)}">Estornar o nº ${l.numero}</button><button class="btn sec" data-a="le-abrir" data-v="">Cancelar</button></div><p class="hint">O estorno inverte todas as partidas (${CT96() ? 'Débito ↔ Crédito' : 'D↔C'}) e fica ligado ao lançamento original.</p></td></tr>` : '';
    return `<tr><td class="num mono">${l.numero}</td><td>${dataBR(l.data)}</td><td>${esc(l.historico)}${l.docRef ? ` <span class="hint">· ${esc(l.docRef)}</span>` : ''}${CT96() ? partidas96(l.itens, m) : `<div class="hint">${l.itens.map(i => `${i.dc} ${esc(i.conta)} ${esc(i.contaNome)} ${fmtN(i.valor)}`).join(' · ')}</div>`}</td><td class="num">${fmtN(l.total)}</td><td>${sit}</td><td class="no-print">${pode('contabil.estornar') && !l.estornoDe && !l.estornadoPor ? `<button class="btn sec sm" data-a="le-abrir" data-v="${esc(l.id)}">Estornar</button>` : ''}</td></tr>${est}`;
  }).join('') : '';
  return `${form}<div class="panel" id="lista-lanc"><div class="row between"><h2>Lançamentos · ${esc(empAtual().nomeFantasia || empAtual().razaoSocial)}</h2><div class="row no-print"><label class="campo"><span>De</span><input type="date" id="ls-de" value="${esc(L.de)}"></label><label class="campo"><span>Até</span><input type="date" id="ls-ate" value="${esc(L.ate)}"></label><label class="campo"><span>Conta (e filhas)</span><input id="ls-conta" list="dlA" value="${esc(L.conta)}" class="mono" style="width:140px"></label><button class="btn sec" data-a="ls-filtrar">Filtrar</button></div></div>
    <div class="tbl" style="margin-top:10px"><table><thead><tr><th class="num">Nº</th><th>Data</th><th>Histórico e partidas</th><th class="num">Total</th><th>Situação</th><th class="no-print"><span class="sr">Ações</span></th></tr></thead><tbody>${lista ? linhas || '<tr><td colspan="6" class="vazio">Nenhum lançamento no período.</td></tr>' : '<tr><td colspan="6" class="vazio">Carregando…</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- aba: relatórios (abas horizontais, KPIs por relatório e comparativo de exercícios) ---------- */
const RELS = [['diario', 'Livro Diário'], ['caixa', 'Livro Caixa'], ['razao', 'Livro Razão'], ['balancete', 'Balancete Geral'], ['dre', 'DRE CPC 26'], ['dre51', 'DRE CPC 51'], ['balanco', 'Balanço Patrimonial'], ['dra', 'DRA'], ['dmpl', 'DMPL'], ['dfc', 'DFC'], ['dva', 'DVA'], ['lalur', 'LALUR']];
const CMP = new Set(['dre', 'dre51', 'balanco']);
const seg = (lista, atual, acao, rot) => `<div class="campo"><span>${rot}</span><div class="seg" role="radiogroup" aria-label="${esc(rot)}">${lista.map(([k, t]) => `<button class="${String(atual) === String(k) ? 'on' : ''}" role="radio" aria-checked="${String(atual) === String(k)}" data-a="${acao}" data-v="${esc(k)}">${esc(t)}</button>`).join('')}</div></div>`;
const menos1 = d => (d ? `${Number(d.slice(0, 4)) - 1}${d.slice(4)}` : d);
const rotPer = (de, ate) => (de && ate && de.slice(5) === '01-01' && ate.slice(5) === '12-31' && de.slice(0, 4) === ate.slice(0, 4) ? 'Exercício ' + de.slice(0, 4) : `${dataBR(de)} a ${dataBR(ate)}`);
function vRelatorios() {
  if (!S.st.plano.criado) return '<div class="panel"><p style="margin:0">Crie o plano de contas antes (aba Plano de contas).</p></div>';
  const R = S.rl, p = S.st.parametros, modelo = R.modelo || p.dreModelo, Y = new Date().getFullYear();
  const tabs = `<div class="subtabs no-print" role="tablist" aria-label="Relatórios contábeis">${RELS.map(([k, t]) => `<button role="tab" id="rt-${k}" aria-selected="${R.tipo === k}" aria-controls="relatorio" data-a="rl-aba" data-v="${k}">${t}</button>`).join('')}</div>`;
  const exAtivo = R.de && R.ate && R.de.slice(5) === '01-01' && R.ate.slice(5) === '12-31' && R.de.slice(0, 4) === R.ate.slice(0, 4) ? R.de.slice(0, 4) : '';
  const ctl = `<div class="panel no-print"><div class="row">
    <label class="campo"><span>De</span><input type="date" id="rl-de" value="${esc(R.de)}"></label><label class="campo"><span>Até</span><input type="date" id="rl-ate" value="${esc(R.ate)}"></label>
    ${CMP.has(R.tipo) ? seg([Y, Y - 1, Y - 2].map(a => [String(a), String(a)]), exAtivo, 'rl-ex', 'Exercício') + seg([['1', 'Lado a lado com o anterior'], ['0', 'Só o período']], R.comparar ? '1' : '0', 'rl-cmp', 'Comparativo') : ''}
    ${R.tipo === 'dre' ? seg([['atual', 'Modelo Atual'], ['reforma', 'Nova Reforma']], modelo, 'rl-modelo', 'Modelo da DRE') + (modelo === 'reforma' ? seg([2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033].map(a => [String(a), String(a)]), R.anoReforma || p.reforma.ano, 'rl-anoref', 'Ano da transição') : '') : ''}
    ${R.tipo === 'razao' || R.tipo === 'caixa' ? `<label class="campo"><span>Conta${R.tipo === 'caixa' ? ' do caixa' : ''}</span><input id="rl-conta" list="dlA" value="${esc(R.tipo === 'caixa' ? R.contaCaixa || '' : R.conta)}" class="mono" style="width:150px" placeholder="${R.tipo === 'caixa' ? '1.1.1.01 (todas)' : '1.1.1.01.001'}"></label>` : ''}
    ${R.tipo === 'lalur' ? seg([['real', 'Lucro Real (LALUR)'], ['presumido', 'Lucro Presumido']], R.regime || p.regime, 'rl-regime', 'Regime') : ''}
    <button class="btn" data-a="rl-gerar">Atualizar</button>
