<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulo Contábil</title>
<style>
/* v13.86 · Módulo Contábil — tela do Módulo 12. Dentro do painel, as cores seguem o tema do painel (tokens copiados). */
:root{
  --navy:#1B2362; --accent:#3F5BD8; --accent-soft:#E6EBFD;
  --bg:#F2F3F8; --panel:#FFFFFF; --panel-2:#F8F9FC; --line:#E2E4EE; --line-soft:#ECEEF5;
  --ink:#151934; --ink-soft:#585E7F; --ink-faint:#616787;
  --ok:#1D7A4E; --ok-soft:#E1F3E9; --warn:#9A6408; --warn-soft:#FCF0D6; --bad:#B63A2F; --bad-soft:#FBE7E4;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-embed]){
  --navy:#C9D0FF; --accent:#8EA2FF; --accent-soft:#232C55;
  --bg:#0E1120; --panel:#161A2C; --panel-2:#1C2136; --line:#2A3050; --line-soft:#232842;
  --ink:#E8EAF6; --ink-soft:#AEB3CF; --ink-faint:#A3A8C6;
  --ok:#5FD39A; --ok-soft:#163528; --warn:#F2C065; --warn-soft:#3A2E12; --bad:#FF8A7E; --bad-soft:#3D1D1A; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:16px}
:root[data-embed] body{padding:4px 2px 24px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 8px} h3{font-size:14px;margin:14px 0 6px}
p{margin:0 0 8px}
.topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
:root[data-embed] .topo{display:none}
.muted{color:var(--ink-soft)} .hint{color:var(--ink-soft);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px;margin-bottom:12px}
.tabs button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row.between{justify-content:space-between;align-items:center}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo>span{font-size:12px;font-weight:600;color:var(--ink-soft)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
:root[data-escuro] .btn:not(.sec):not(.danger){color:#0E1120}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--line-soft);color:var(--ink-soft);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--ink)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:62vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel-2);font-size:12px;color:var(--ink-soft);z-index:1}
tr.sint td{font-weight:700} tr.inativa td{color:var(--ink-faint);text-decoration:line-through}
tr.tot td{font-weight:700;border-top:2px solid var(--line)} tr.sub td{font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.ind1{padding-left:18px}.ind2{padding-left:32px}.ind3{padding-left:46px}.ind4{padding-left:60px}.ind5{padding-left:74px}
.edit-row td{background:var(--panel-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lin-lanc{display:grid;grid-template-columns:minmax(150px,2fr) 74px minmax(110px,1fr) minmax(100px,1fr) minmax(120px,1.5fr) 34px;gap:6px;align-items:center;margin-bottom:6px}
.tot-lanc{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-weight:600}
.tot-lanc .dif{color:var(--bad)} .tot-lanc .ok{color:var(--ok)}
details>summary{cursor:pointer;font-weight:600;padding:2px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.vazio{padding:18px;text-align:center;color:var(--ink-soft)}
.rel-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.cmp div{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px}
.cmp b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){ .grid2,.cmp{grid-template-columns:1fr} .lin-lanc{grid-template-columns:1fr 70px 1fr 34px} .lin-lanc .opc{display:none} body{padding:10px} }
@media print{ body{background:#fff;color:#000;padding:0} .no-print,.tabs,.topo,.toast{display:none!important} .panel{border:0;padding:0} .tbl{max-height:none;overflow:visible;border:0} th{position:static} }
</style>
</head>
<body>
<div class="topo"><div><h1>Módulo Contábil</h1><p class="muted" style="margin:0">Plano de contas único, partidas dobradas, relatórios e parâmetros tributários.</p></div><a class="btn sec sm" href="./">Voltar ao painel</a></div>
<div id="app"><div class="panel"><p class="muted" style="margin:0">Carregando o Módulo Contábil…</p></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* =====================================================================
   v13.86 · MÓDULO CONTÁBIL (contabilidade.html) — fala com /api/contabil (mesma origem do painel).
   As regras ficam no servidor e no banco: partidas dobradas, lançamentos intangíveis (só estorno), período
   fechado e cadeia de conferência. Esta tela só monta os pedidos e mostra as respostas.
   Abas: Plano de contas · De-para do FCX · Lançamentos · Relatórios · Parâmetros.
   ===================================================================== */
const EMBED = new URLSearchParams(location.search).has('embed');
const PAI = (() => { try { return window.parent !== window && window.parent.PainelFCX ? window.parent : null; } catch (e) { return null; } })();
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = v => (Math.round((Number(v) || 0) * 10000) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const dataBR = d => (d ? String(d).slice(0, 10).split('-').reverse().join('/') : '');
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
/** "1.234,56" | "1234.56" | 1234.56 → número */
const lerValor = v => { if (typeof v === 'number') return v; const s = String(v || '').trim().replace(/\s|R\$/g, ''); if (!s) return NaN; return Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); };
const cent = v => Math.round(lerValor(v) * 100);

async function api(met, rota, corpo) {
  const r = await fetch('/api/contabil' + rota, { method: met, credentials: 'same-origin', cache: 'no-store', headers: { 'x-painel': '1', ...(corpo !== undefined ? { 'content-type': 'application/json' } : {}) }, body: corpo === undefined ? undefined : JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.erro || 'Erro ' + r.status + ' no servidor.'); e.status = r.status; e.dados = j; throw e; }
  return j;
}
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }
const falhou = e => toast(e && e.message ? e.message : String(e));
/** confirmação em dois cliques (confirm() pode ser bloqueado em molduras) */
let pend = null;
function confirmar(chave, msg) { const t = Date.now(); if (pend && pend.k === chave && t - pend.t < 6000) { pend = null; return true; } pend = { k: chave, t }; toast(msg + ' Clique de novo para confirmar.'); return false; }

/* ---------- tema: dentro do painel, copia os tokens de cor do painel (e acompanha a troca de tema) ---------- */
const TOK = ['--navy', '--accent', '--accent-soft', '--bg', '--panel', '--panel-2', '--line', '--line-soft', '--ink', '--ink-soft', '--ink-faint', '--ok', '--ok-soft', '--warn', '--warn-soft', '--bad', '--bad-soft'];
function lum(c) { const m = String(c).match(/[\d.]+/g); if (!m) { const h = String(c).replace('#', ''); if (h.length < 6) return 1; return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0); } return (m[0] * 0.2126 + m[1] * 0.7152 + m[2] * 0.0722) / 255; }
function tema() {
  if (!PAI) return;
  try { const cs = PAI.getComputedStyle(PAI.document.documentElement), r = document.documentElement; let n = 0;
    TOK.forEach(t => { const v = cs.getPropertyValue(t).trim(); if (v) { r.style.setProperty(t, v); n++; } });
    if (n) { r.dataset.embed = '1'; const esc_ = lum(cs.getPropertyValue('--bg').trim() || '#fff') < 0.4; r.toggleAttribute('data-escuro', esc_); r.style.colorScheme = esc_ ? 'dark' : 'light'; }
  } catch (e) { /* sem acesso ao painel: tema próprio */ }
}
if (PAI) { tema(); try { new PAI.MutationObserver(tema).observe(PAI.document.documentElement, { attributes: true }); PAI.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(tema, 50)); } catch (e) { } }
else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-escuro', '');

/* ---------- estado ---------- */
const S = {
  aba: 'plano', st: null, contas: [], erro: null,
  pl: { busca: '', tipo: '', grupo: '', inativas: false, edit: null, sug: null, nome: '', pai: '' },
  dp: { itens: null, resumo: null, busca: '', status: '', edit: null },
  lf: null, ls: { lista: null, de: '', ate: '', conta: '', estorno: null },
  rl: { tipo: 'balancete', de: '', ate: '', modelo: '', anoReforma: '', conta: '', regime: '', dados: null, carregando: false },
  pr: { lalur: null, ano: new Date().getFullYear(), integ: null },
};
const ABAS = [['plano', 'Plano de contas'], ['depara', 'De-para do FCX'], ['lancamentos', 'Lançamentos'], ['relatorios', 'Relatórios'], ['parametros', 'Parâmetros']];
const pode = p => !!(S.st && S.st.permissoes && S.st.permissoes.includes(p));
const cat = () => (S.st && S.st.catalogo) || { grupos: {}, dre: {}, dva: {}, tributosAtuais: [], tributosReforma: [], outrosTributos: [] };
const porCodigo = () => new Map(S.contas.map(c => [c.codigo, c]));
const analiticas = () => S.contas.filter(c => c.tipo === 'A' && c.ativa);
function novoLanc() { return { data: hoje(), historico: '', docRef: '', itens: [{ conta: '', dc: 'D', valor: '', historico: '' }, { conta: '', dc: 'C', valor: '', historico: '' }] }; }
S.lf = novoLanc();
{ const a = new Date().getFullYear(); S.ls.de = S.rl.de = `${a}-01-01`; S.ls.ate = S.rl.ate = `${a}-12-31`; }

async function carregarBase() {
  S.st = await api('GET', '');
  S.contas = S.st.plano.criado ? (await api('GET', '/contas')).contas : [];
}
async function carregarDepara() { const j = await api('GET', '/depara'); S.dp.itens = j.itens; S.dp.resumo = j.resumo; }
async function carregarLancs() { const p = new URLSearchParams({ de: S.ls.de, ate: S.ls.ate, limite: '1000' }); if (S.ls.conta) p.set('conta', S.ls.conta); S.ls.lista = (await api('GET', '/lancamentos?' + p)).lancamentos; }
function avisarFCX() { try { PAI && PAI.PainelFCX.planoAlterado && PAI.PainelFCX.planoAlterado(); } catch (e) { } }

async function irAba(a) {
  if (!ABAS.some(x => x[0] === a)) return;
  S.aba = a; render();
  try {
    if (a === 'depara' && !S.dp.itens) { await carregarDepara(); render(); }
    if (a === 'lancamentos' && !S.ls.lista) { await carregarLancs(); render(); }
    if (a === 'parametros' && !S.pr.lalur) { S.pr.lalur = (await api('GET', '/lalur?ano=' + S.pr.ano)).ajustes; render(); }
  } catch (e) { falhou(e); }
}

/* ---------- desenho ---------- */
function render() {
  const app = $('#app'), at = document.activeElement, id = at && at.id, sel = at && 'selectionStart' in at ? [at.selectionStart, at.selectionEnd] : null;
  if (S.erro) { app.innerHTML = `<div class="panel"><h2>Módulo Contábil indisponível</h2><p>${esc(S.erro)}</p><button class="btn sec" data-a="recarregar">Tentar de novo</button></div>`; return; }
  if (!S.st) return;
  const st = S.st, ro = !['contabil.lancar', 'contabil.plano', 'contabil.estornar', 'contabil.parametros'].some(pode);
  const corpo = { plano: vPlano, depara: vDepara, lancamentos: vLancamentos, relatorios: vRelatorios, parametros: vParametros }[S.aba]();
  app.innerHTML = `<div class="tabs no-print" role="tablist" aria-label="Seções do Módulo Contábil">${ABAS.map(([k, r]) => `<button role="tab" id="tab-${k}" aria-selected="${S.aba === k}" data-a="aba" data-v="${k}">${r}${k === 'depara' && st.depara && st.depara.pendente ? ` <span class="pill warn">${st.depara.pendente}</span>` : ''}</button>`).join('')}</div>
    <p class="hint no-print" style="margin:-4px 0 10px">${st.plano.criado ? `Plano: <b>${st.plano.contas}</b> contas (${st.plano.analiticas} analíticas)` : 'Plano de contas ainda não criado'} · <b>${st.lancamentos.total}</b> lançamento(s) · Regime: <b>${st.parametros.regime === 'real' ? 'Lucro Real' : 'Lucro Presumido'}</b> · DRE padrão: <b>${st.parametros.dreModelo === 'reforma' ? 'Nova Reforma' : 'Modelo Atual'}</b>${st.parametros.fechadoAte ? ` · período fechado até ${dataBR(st.parametros.fechadoAte)}` : ''}${ro ? ' · <span class="pill">somente consulta</span>' : ''}</p>
    <section role="tabpanel" aria-labelledby="tab-${S.aba}">${corpo}</section>
    <datalist id="dlA">${analiticas().map(c => `<option value="${esc(c.codigo)}">${esc(c.nome)}</option>`).join('')}</datalist>
    <datalist id="dlS">${S.contas.filter(c => c.tipo === 'S' && c.ativa).map(c => `<option value="${esc(c.codigo)}">${esc(c.nome)}</option>`).join('')}</datalist>`;
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { } } }
}
const opts = (lista, v) => lista.map(([k, r]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(r)}</option>`).join('');
const tribChecks = (sel, pref) => { const c = cat(); return [...c.tributosAtuais, ...c.tributosReforma, ...c.outrosTributos].map(t => `<label style="margin-right:10px;white-space:nowrap"><input type="checkbox" data-trib="${pref}" value="${t}" ${sel.includes(t) ? 'checked' : ''}> ${t}${c.tributosReforma.includes(t) ? ' <small class="muted">(reforma)</small>' : ''}</label>`).join(''); };
const nat = n => (n === 'D' ? 'Devedora' : 'Credora');

/* ---------- aba: plano de contas ---------- */
function vPlano() {
  const st = S.st;
  if (!st.plano.criado) return `<div class="panel"><h2>O plano de contas ainda não foi criado</h2>
    <p>O ponto de partida combinado é <b>importar as contas que o FCX já usa</b>: o Módulo Contábil cria o plano padrão (comércio varejista, 184 contas com as da Reforma — IBS, CBS e Imposto Seletivo), liga cada conta do FCX a uma conta do plano (de-para) e completa o que faltar.</p>
    <div class="row">${pode('contabil.plano') ? '<button class="btn" data-a="importar-fcx">Importar contas do FCX</button>' : ''}${pode('contabil.parametros') ? '<button class="btn sec" data-a="plano-padrao">Só criar o plano padrão</button>' : ''}${!pode('contabil.plano') && !pode('contabil.parametros') ? '<p class="muted">Peça a quem gerencia o plano de contas (Gestão de Acessos › Contabilidade · Modificar).</p>' : ''}</div></div>`;
  const P = S.pl, q = P.busca.toLowerCase().trim(), mapa = porCodigo(), c = cat();
  const lista = S.contas.filter(x => (P.inativas || x.ativa) && (!P.tipo || x.tipo === P.tipo) && (!P.grupo || String(x.grupo) === P.grupo) && (!q || x.codigo.startsWith(q) || x.nome.toLowerCase().includes(q)));
  const linhas = lista.map(x => {
    const ed = P.edit === x.codigo;
    const row = `<tr class="${x.tipo === 'S' ? 'sint' : ''} ${x.ativa ? '' : 'inativa'}"><td class="mono">${esc(x.codigo)}</td><td class="ind${Math.min(5, x.nivel - 1)}">${esc(x.nome)}${x.redutora ? ' <span class="pill">retificadora</span>' : ''}</td><td>${x.tipo === 'S' ? 'Sintética' : 'Analítica'}</td><td>${nat(x.natureza)}</td><td>${x.dre ? esc(c.dre[x.dre] || x.dre) : '<span class="muted">—</span>'}</td><td>${x.tributos.length ? x.tributos.map(t => `<span class="pill ${c.tributosReforma.includes(t) ? 'info' : ''}">${esc(t)}</span>`).join(' ') : '<span class="muted">—</span>'}</td><td class="no-print">${pode('contabil.plano') ? `<button class="btn sec sm" data-a="pl-editar" data-v="${esc(x.codigo)}" aria-expanded="${ed}">${ed ? 'Fechar' : 'Editar'}</button>` : ''}</td></tr>`;
    if (!ed) return row;
    const g = x.grupo >= 4;
    return row + `<tr class="edit-row"><td colspan="7"><div class="row">
      <label class="campo" style="flex:2 1 260px"><span>Nome</span><input id="pe-nome" value="${esc(x.nome)}"></label>
      <label class="campo"><span>Tipo</span><select id="pe-tipo">${opts([['A', 'Analítica'], ['S', 'Sintética']], x.tipo)}</select></label>
      ${g ? `<label class="campo"><span>Linha da DRE</span><select id="pe-dre"><option value="">—</option>${opts(Object.entries(c.dre), x.dre)}</select></label><label class="campo"><span>Linha da DVA</span><select id="pe-dva"><option value="">—</option>${opts(Object.entries(c.dva), x.dva)}</select></label>` : ''}
      <label class="campo"><span>Situação</span><select id="pe-ativa">${opts([['1', 'Ativa'], ['0', 'Inativa']], x.ativa ? '1' : '0')}</select></label></div>
      <div style="margin:8px 0"><span class="hint">Vínculo tributário: </span>${tribChecks(x.tributos, 'pe')}</div>
      <div class="row"><button class="btn sm" data-a="pl-salvar" data-v="${esc(x.codigo)}">Salvar</button><button class="btn sec sm" data-a="pl-editar" data-v="">Cancelar</button><button class="btn danger sm" data-a="pl-excluir" data-v="${esc(x.codigo)}">Excluir (só sem lançamentos)</button>
      <span class="hint">Código, grupo e conta-mãe não mudam. Natureza e tipo travam depois do primeiro lançamento.</span></div></td></tr>`;
  }).join('');
  const sug = P.sug;
  const nova = pode('contabil.plano') ? `<details class="panel no-print" id="plNova" ${sug || P.nome ? 'open' : ''}><summary>+ Nova conta (com classificação automática)</summary>

/* ---------- aba: de-para do FCX ---------- */
const ST_DP = { automatico: ['ok', 'Automático'], revisado: ['info', 'Revisado'], pendente: ['warn', 'Pendente'] };
function vDepara() {
  if (!S.dp.itens) return '<div class="panel"><p class="muted" style="margin:0">Carregando o de-para…</p></div>';

  const auto = D.itens.filter(x => x.status === 'automatico' && x.ativa && x.conta);
  const linhas = lista.map(x => {

    const cont = ed ? `<div class="row"><input id="dp-conta" list="${x.agrupador ? 'dlS' : 'dlA'}" value="${esc(x.conta || '')}" class="mono" style="width:150px" aria-label="Conta contábil para ${esc(x.chave)}"><button class="btn sm" data-a="dp-salvar" data-v="${esc(x.chave)}">Salvar</button><button class="btn sec sm" data-a="dp-editar" data-v="">Cancelar</button></div><span class="hint">${x.agrupador ? 'Agrupador do ERP: escolha uma conta sintética.' : 'Recebe lançamentos: escolha uma conta analítica.'}</span>`
      : x.conta ? `<span class="mono"><b>${esc(x.conta)}</b></span> · ${esc(x.contaNome || '')}` : '<span class="muted">— sem conta —</span>';

  }).join('');
  return `<div class="panel"><div class="row between"><div><h2>De-para do FCX → plano de contas</h2><p class="hint" style="margin:0;max-width:820px">O FCX não cadastra mais contas: a lista dele vem daqui, em modo consulta. Cada conta do FCX (rótulo do ERP, que o painel analítico e a DFC continuam usando) aponta para uma conta do plano único. Os agrupadores do ERP apontam para a sintética correspondente. <b>Pendente</b> = a regra não teve confiança suficiente: confira e confirme.</p></div>
      <div class="row no-print">${gerir ? `<button class="btn" data-a="importar-fcx">Importar contas do FCX</button>${auto.length ? `<button class="btn sec" data-a="dp-confirmar-todos">Confirmar os ${auto.length} automáticos</button>` : ''}` : ''}</div></div>
    <div class="chips">${[['', 'Todas', r.total], ['pendente', 'Pendentes', r.pendente], ['automatico', 'Automáticas', r.automatico], ['revisado', 'Revisadas', r.revisado], ['agrupador', 'Agrupadores', r.agrupadores], ['contabil', 'Criadas no Contábil', r.doContabil], ['inativa', 'Inativas', r.inativas]].map(([k, t, n]) => `<button class="btn ${D.status === k ? '' : 'sec'} sm" data-a="dp-filtro" data-v="${k}" aria-pressed="${D.status === k}">${t} · ${n}</button>`).join('')}</div>
    ${gerir ? `<details class="no-print" style="margin-bottom:10px"><summary>+ Conta nova para o FCX</summary><div class="row" style="margin-top:8px"><label class="campo" style="flex:2 1 300px"><span>Conta do FCX (com o código do ERP)</span><input id="dp-novo" placeholder="Ex.: 4.10.17 – (-) Nova despesa de ocupação"></label><label class="campo"><span>Conta contábil (opcional)</span><input id="dp-novo-conta" list="dlA" class="mono" style="width:150px" placeholder="sugestão automática"></label><button class="btn" data-a="dp-criar">Criar para o FCX</button></div><p class="hint">Sem conta contábil, a regra do ERP sugere; sem código do ERP, a classificação pelo nome sugere e fica pendente.</p></details>` : ''}

}

/* ---------- aba: lançamentos ---------- */
function totaisLanc() { let d = 0, c = 0; S.lf.itens.forEach(i => { const v = cent(i.valor); if (v > 0) { if (i.dc === 'D') d += v; else c += v; } }); return { d, c }; }
function lancValido() {
  const f = S.lf, m = porCodigo(), { d, c } = totaisLanc(), prob = [];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.data)) prob.push('data');
  if (f.historico.trim().length < 3) prob.push('histórico');
  const us = f.itens.filter(i => i.conta || i.valor);
  if (us.length < 2) prob.push('ao menos duas partidas');
  us.forEach((i, k) => { const x = m.get(i.conta.trim()); if (!x) prob.push(`conta da partida ${k + 1}`); else if (x.tipo !== 'A' || !x.ativa) prob.push(`partida ${k + 1}: conta sintética ou inativa`); if (!(cent(i.valor) > 0)) prob.push(`valor da partida ${k + 1}`); });
  if (!d || !c) prob.push('um débito e um crédito');
  if (d !== c) prob.push('débitos = créditos');
  return { ok: !prob.length, prob, d, c };
}
function htmlTotais() { const v = lancValido(), dif = v.d - v.c; return `<span>Débitos: ${fmt(v.d / 100)}</span><span>Créditos: ${fmt(v.c / 100)}</span><span class="${dif ? 'dif' : 'ok'}">${dif ? 'Diferença: ' + fmt(Math.abs(dif) / 100) : '✓ Partidas dobradas: D = C'}</span>${v.ok ? '' : `<span class="hint" style="font-weight:400">Falta: ${esc([...new Set(v.prob)].slice(0, 4).join(', '))}</span>`}`; }
function atualizarTotais() { const t = $('#lf-tot'); if (t) t.innerHTML = htmlTotais(); const b = $('#lf-gravar'); if (b) b.disabled = !lancValido().ok; }
function vLancamentos() {
  const f = S.lf, L = S.ls, m = porCodigo();
  if (!S.st.plano.criado) return '<div class="panel"><p style="margin:0">Crie o plano de contas antes de lançar (aba Plano de contas).</p></div>';
  const form = pode('contabil.lancar') ? `<div class="panel no-print"><h2>Novo lançamento (partidas dobradas)</h2>
    <div class="row"><label class="campo"><span>Data</span><input type="date" id="lf-data" value="${esc(f.data)}"></label><label class="campo" style="flex:3 1 320px"><span>Histórico</span><input id="lf-hist" value="${esc(f.historico)}" placeholder="Ex.: Compra de mercadorias NF 1234"></label><label class="campo" style="flex:1 1 140px"><span>Documento (opcional)</span><input id="lf-doc" value="${esc(f.docRef)}"></label></div>
    <div style="margin-top:10px">${f.itens.map((i, k) => { const x = m.get(i.conta.trim()); return `<div class="lin-lanc"><input data-li="${k}" data-f="conta" list="dlA" value="${esc(i.conta)}" class="mono" placeholder="Conta analítica" aria-label="Conta da partida ${k + 1}" title="${esc(x ? x.nome : '')}"><select data-li="${k}" data-f="dc" aria-label="Débito ou crédito da partida ${k + 1}">${opts([['D', 'D'], ['C', 'C']], i.dc)}</select><input data-li="${k}" data-f="valor" value="${esc(i.valor)}" inputmode="decimal" placeholder="0,00" style="text-align:right" aria-label="Valor da partida ${k + 1}"><span class="hint opc">${esc(x ? x.nome : i.conta ? 'conta não encontrada' : '')}</span><input class="opc" data-li="${k}" data-f="historico" value="${esc(i.historico)}" placeholder="Histórico da partida (opcional)" aria-label="Histórico da partida ${k + 1}"><button class="btn sec sm" data-a="lf-tirar" data-v="${k}" aria-label="Remover partida ${k + 1}" ${f.itens.length <= 2 ? 'disabled' : ''}>×</button></div>`; }).join('')}</div>
    <div class="row"><button class="btn sec sm" data-a="lf-mais">+ partida</button></div>
    <div class="tot-lanc" id="lf-tot" aria-live="polite">${htmlTotais()}</div>
    <div class="row"><button class="btn" id="lf-gravar" data-a="lf-gravar" ${lancValido().ok ? '' : 'disabled'}>Gravar lançamento</button><button class="btn sec" data-a="lf-limpar">Limpar</button><span class="hint">Depois de gravado, o lançamento não se altera nem se exclui: correções são feitas por estorno (ligado ao original).</span></div></div>` : '';
  const lista = L.lista ? [...L.lista].reverse() : null;
  const linhas = lista ? lista.map(l => {
    const sit = l.estornoDe ? `<span class="pill info">Estorno do nº ${esc((L.lista.find(x => x.id === l.estornoDe) || {}).numero || '')}</span>` : l.estornadoPor ? '<span class="pill warn">Estornado</span>' : l.origem === 'encerramento' ? '<span class="pill">Encerramento</span>' : '';
    const est = L.estorno === l.id ? `<tr class="edit-row"><td colspan="6"><div class="row"><label class="campo" style="flex:2 1 300px"><span>Motivo do estorno</span><input id="le-motivo" placeholder="Ex.: valor digitado errado"></label><label class="campo"><span>Data do estorno</span><input type="date" id="le-data" value="${hoje()}"></label><button class="btn danger" data-a="le-confirmar" data-v="${esc(l.id)}">Estornar o nº ${l.numero}</button><button class="btn sec" data-a="le-abrir" data-v="">Cancelar</button></div><p class="hint">O estorno inverte todas as partidas (D↔C) e fica ligado ao lançamento original.</p></td></tr>` : '';
    return `<tr><td class="num mono">${l.numero}</td><td>${dataBR(l.data)}</td><td>${esc(l.historico)}${l.docRef ? ` <span class="hint">· ${esc(l.docRef)}</span>` : ''}<div class="hint">${l.itens.map(i => `${i.dc} ${esc(i.conta)} ${esc(i.contaNome)} ${fmtN(i.valor)}`).join(' · ')}</div></td><td class="num">${fmtN(l.total)}</td><td>${sit}</td><td class="no-print">${pode('contabil.estornar') && !l.estornoDe && !l.estornadoPor ? `<button class="btn sec sm" data-a="le-abrir" data-v="${esc(l.id)}">Estornar</button>` : ''}</td></tr>${est}`;
  }).join('') : '';
  return `${form}<div class="panel"><div class="row between"><h2>Lançamentos</h2><div class="row no-print"><label class="campo"><span>De</span><input type="date" id="ls-de" value="${esc(L.de)}"></label><label class="campo"><span>Até</span><input type="date" id="ls-ate" value="${esc(L.ate)}"></label><label class="campo"><span>Conta (e filhas)</span><input id="ls-conta" list="dlA" value="${esc(L.conta)}" class="mono" style="width:140px"></label><button class="btn sec" data-a="ls-filtrar">Filtrar</button></div></div>
    <div class="tbl" style="margin-top:10px"><table><thead><tr><th class="num">Nº</th><th>Data</th><th>Histórico e partidas</th><th class="num">Total</th><th>Situação</th><th class="no-print"><span class="sr">Ações</span></th></tr></thead><tbody>${lista ? linhas || '<tr><td colspan="6" class="vazio">Nenhum lançamento no período.</td></tr>' : '<tr><td colspan="6" class="vazio">Carregando…</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- aba: relatórios ---------- */
const RELS = [['diario', 'Livro Diário'], ['razao', 'Razão'], ['balancete', 'Balancete de Verificação'], ['dre', 'DRE'], ['balanco', 'Balanço Patrimonial'], ['dmpl', 'DMPL'], ['dra', 'DRA'], ['dva', 'DVA'], ['lalur', 'LALUR / Apuração do IRPJ e da CSLL']];

    ${R.tipo === 'razao' ? `<label class="campo"><span>Conta</span><input id="rl-conta" list="dlA" value="${esc(R.conta)}" class="mono" style="width:150px" placeholder="1.1.1.01.001"></label>` : ''}
    ${R.tipo === 'lalur' ? `<label class="campo"><span>Regime</span><select id="rl-regime">${opts([['real', 'Lucro Real (LALUR)'], ['presumido', 'Lucro Presumido']], R.regime || p.regime)}</select></label>` : ''}

}
const vl = v => `<td class="num">${fmtN(v)}</td>`;
const dc = (v, natureza) => { const n = Number(v) || 0; return n ? `${fmtN(Math.abs(n))} ${n > 0 ? 'D' : 'C'}` : '0,00'; };
function relHTML(d) {
  const tit = (RELS.find(r => r[0] === d.tipo) || [0, d.tipo])[1], cab = `<div class="rel-cab"><h2 style="margin:0">${esc(tit)}${d.tipo === 'dre' ? ' · ' + (d.modelo === 'reforma' ? 'Nova Reforma (simulação)' : 'Modelo Atual') : ''}</h2><span class="hint">Período: ${dataBR(d.de)} a ${dataBR(d.ate)} · gerado em ${new Date(d.geradoEm).toLocaleString('pt-BR')}</span></div>`;
  const notas = l => (l && l.length ? `<ul class="hint" style="margin:10px 0 0;padding-left:18px">${l.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '');
  const tabela = (th, tr) => `<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
  if (d.tipo === 'diario') return cab + tabela('<th>Nº</th><th>Data</th><th>Conta</th><th>Histórico</th><th class="num">Débito</th><th class="num">Crédito</th>', d.lancamentos.map(l => `<tr class="sub"><td class="mono">${l.numero}</td><td>${dataBR(l.data)}</td><td colspan="2">${esc(l.historico)}${l.estornoDe ? ' <span class="pill info">estorno</span>' : ''}</td><td></td><td></td></tr>${l.itens.map(i => `<tr><td></td><td></td><td class="mono ${i.dc === 'C' ? 'ind1' : ''}">${esc(i.conta)} · ${esc(i.contaNome)}</td><td class="hint">${esc(i.historico || '')}</td>${i.dc === 'D' ? vl(i.valor) + '<td></td>' : '<td></td>' + vl(i.valor)}</tr>`).join('')}`).join('') + `<tr class="tot"><td colspan="4">${d.totais.lancamentos} lançamento(s)</td>${vl(d.totais.valor)}${vl(d.totais.valor)}</tr>`);
  if (d.tipo === 'razao') return cab + `<p><b class="mono">${esc(d.conta.codigo)}</b> · ${esc(d.conta.nome)} · natureza ${nat(d.conta.natureza).toLowerCase()} · saldo anterior ${dc(d.saldoAnterior)}</p>` + tabela('<th>Data</th><th>Nº</th><th>Histórico</th><th>Contrapartida</th><th class="num">Débito</th><th class="num">Crédito</th><th class="num">Saldo</th>', d.linhas.map(l => `<tr><td>${dataBR(l.data)}</td><td class="mono">${l.numero}</td><td>${esc(l.historico)}</td><td class="mono">${esc(l.contrapartidas.join(', '))}</td>${vl(l.debito)}${vl(l.credito)}<td class="num">${fmtN(Math.abs(l.saldo))} ${l.dc}</td></tr>`).join('') + `<tr class="tot"><td colspan="6">Saldo final</td><td class="num">${dc(d.saldoFinal)}</td></tr>`);
  if (d.tipo === 'balancete') return cab + `<p>${d.confere ? '<span class="pill ok">Confere: débitos = créditos</span>' : '<span class="pill bad">Não confere</span>'}</p>` + tabela('<th>Código</th><th>Conta</th><th class="num">Saldo anterior</th><th class="num">Débitos</th><th class="num">Créditos</th><th class="num">Saldo final</th>', d.linhas.map(l => `<tr class="${l.tipo === 'S' ? 'sint' : ''}"><td class="mono">${esc(l.codigo)}</td><td class="ind${Math.min(5, l.nivel - 1)}">${esc(l.nome)}</td><td class="num">${dc(l.saldoAnterior)}</td>${vl(l.debitos)}${vl(l.creditos)}<td class="num">${fmtN(l.saldoFinal)} ${l.dc}</td></tr>`).join('') + `<tr class="tot"><td colspan="3">Totais (analíticas)</td>${vl(d.totais.debitos)}${vl(d.totais.creditos)}<td class="num">D ${fmtN(d.totais.saldoDevedor)} · C ${fmtN(d.totais.saldoCredor)}</td></tr>`);
  if (d.tipo === 'dre') { const c = d.comparativo; return cab + tabela('<th>Demonstração do Resultado do Exercício</th><th class="num">Valor</th>', d.linhas.map(l => `<tr class="${l.tipo === 'total' ? 'tot' : l.tipo === 'subtotal' ? 'sub' : ''}"><td class="ind${l.nivel}">${esc(l.rotulo)}</td>${vl(l.valor)}</tr>`).join(''))
    + (c ? `<h3>Comparativo: Modelo Atual × Nova Reforma${d.transicao ? ' (' + d.transicao.ano + ')' : ''}</h3><div class="cmp"><div><span class="hint">Lucro líquido · Modelo Atual</span><b>${fmt(c.atual.lucroLiquido)}</b><span class="hint">Receita líquida ${fmt(c.atual.receitaLiquida)}</span></div><div><span class="hint">Lucro líquido · Nova Reforma</span><b>${fmt(c.reforma.lucroLiquido)}</b><span class="hint">Receita líquida ${fmt(c.reforma.receitaLiquida)}</span></div><div><span class="hint">Diferença no lucro</span><b>${fmt(c.diferencaLucro)}</b><span class="hint">${d.transicao ? esc(d.transicao.nota) : ''}</span></div></div>` : '') + notas(d.notas); }
  if (d.tipo === 'balanco') { const bloco = (t, g) => `<tr class="sub"><td colspan="2">${t}</td>${vl(g.total)}</tr>${g.contas.map(c => `<tr><td class="mono ind1">${esc(c.codigo)}</td><td>${esc(c.nome)}</td>${vl(c.valor)}</tr>`).join('')}`;
    return cab + `<p>${d.confere ? '<span class="pill ok">Confere: Ativo = Passivo + PL</span>' : `<span class="pill bad">Diferença de ${fmt(d.diferenca)}</span>`}</p><div class="grid2">` + tabela('<th colspan="2">Ativo</th><th class="num">Valor</th>', bloco('Circulante', d.ativo.circulante) + bloco('Não circulante', d.ativo.naoCirculante) + `<tr class="tot"><td colspan="2">Total do Ativo</td>${vl(d.ativo.total)}</tr>`)
      + tabela('<th colspan="2">Passivo e Patrimônio Líquido</th><th class="num">Valor</th>', bloco('Passivo circulante', d.passivo.circulante) + bloco('Passivo não circulante', d.passivo.naoCirculante) + bloco('Patrimônio líquido', d.patrimonioLiquido) + `<tr class="tot"><td colspan="2">Total do Passivo + PL</td>${vl(d.passivoMaisPL)}</tr>`) + '</div>'; }
  if (d.tipo === 'dmpl') return cab + tabela(`<th>Movimentação</th>${d.colunas.map(c => `<th class="num">${esc(c.nome)}</th>`).join('')}<th class="num">Total</th>`, d.linhas.map((l, i) => `<tr class="${i === 0 || i === d.linhas.length - 1 ? 'tot' : ''}"><td>${esc(l.rotulo)}</td>${d.colunas.map(c => vl(l.valores[c.codigo])).join('')}${vl(l.total)}</tr>`).join(''));
  if (d.tipo === 'dra') return cab + tabela('<th>Demonstração do Resultado Abrangente</th><th class="num">Valor</th>', d.linhas.map(l => `<tr class="${l.total ? 'tot' : ''}"><td>${esc(l.rotulo)}</td>${vl(l.valor)}</tr>`).join(''));
  if (d.tipo === 'dva') return cab + `<p>${d.conferencia.ok ? '<span class="pill ok">Confere com o lucro líquido da DRE</span>' : `<span class="pill bad">Diferença de ${fmt(d.conferencia.diferenca)} com a DRE</span>`}</p>` + tabela('<th>Demonstração do Valor Adicionado</th><th class="num">Valor</th>', d.linhas.map(l => `<tr class="${l.total ? 'sub' : ''}"><td class="ind${l.nivel}">${esc(l.rotulo)}</td>${vl(l.valor)}</tr>`).join('')) + notas(d.notas);
  if (d.tipo === 'lalur') { const L = (r, v, t) => `<tr class="${t || ''}"><td>${r}</td>${vl(v)}</tr>`;
    const corpo = d.regime === 'real' ? L('Lucro antes do IRPJ e da CSLL (LAIR)', d.lair) + L('(+) Adições (IRPJ)', d.adicoesIRPJ) + L('(−) Exclusões (IRPJ)', -d.exclusoesIRPJ) + L('Lucro ajustado', d.lucroAjustado, 'sub') + L('(−) Compensação de prejuízos (até 30%)', -d.compensacaoIRPJ) + L('Lucro real', d.lucroReal, 'sub') + L('Base da CSLL', d.baseCSLL) + L('IRPJ (15% + adicional de 10%)', d.irpj) + L('CSLL (9%)', d.csll) + L('Total de IRPJ e CSLL', d.total, 'tot') + (d.prejuizoFiscal ? L('Prejuízo fiscal do período (Parte B)', d.prejuizoFiscal) : '')
      : L('Receita bruta', d.receitaBruta) + L('Base presumida do IRPJ', d.baseIRPJ) + L('Base presumida da CSLL', d.baseCSLL) + (d.excedenteLC224 ? L('Receita acima de R$ 5 milhões (LC 224/2025)', d.excedenteLC224) : '') + L('IRPJ (15% + adicional de 10%)', d.irpj) + L('CSLL (9%)', d.csll) + L('Total de IRPJ e CSLL', d.total, 'tot');
    return cab + `<p><span class="pill info">${d.regime === 'real' ? 'Lucro Real' : 'Lucro Presumido'}</span> · ano ${d.ano} · IRPJ/CSLL já escriturados no período: ${fmt(d.irpjCsllEscriturados)}</p>` + tabela('<th>Apuração</th><th class="num">Valor</th>', corpo) + notas(d.notas); }
  return cab + `<pre class="mono">${esc(JSON.stringify(d, null, 2))}</pre>`;
}

async function recarregarBase() { await carregarBase(); render(); }
const ctV1399 = () => { try { return !!(PAI && PAI.Recursos && PAI.Recursos.ativo('gestao_v1399') && PAI.CargaFeedback && typeof PAI.CargaFeedback.mostrar === 'function'); } catch (e) { return false; } }; // v13.99: popup de crítica de carga (exibido pelo painel)
async function importarFCX() {
  if (!PAI || !PAI.PainelFCX || !PAI.PainelFCX.contasFCX) return toast('Abra o Módulo Contábil pelo painel (menu Contabilidade) para importar as contas do FCX.');
  toast('Lendo as contas do FCX…');
  let f, r;
  try {
    f = await PAI.PainelFCX.contasFCX();
    r = await api('POST', '/importar-fcx', { contas: f.contas, usadas: f.usadas });
  } catch (e) {
    if (ctV1399()) PAI.CargaFeedback.falha('Módulo Contábil · Importar contas do FCX', null, e, { arquivos: [{ nome: 'Plano de contas do FCX (leitura direta)' }] });
    throw e;
  }
  await carregarBase(); await carregarDepara(); S.aba = 'depara'; render(); avisarFCX();
  toast(`${r.planoCriado ? 'Plano padrão criado (' + r.planoCriado + ' contas). ' : ''}${r.novos} conta(s) do FCX mapeadas${r.criadas.length ? ', ' + r.criadas.length + ' conta(s) nova(s) no plano' : ''}${r.complemento ? ', ' + r.complemento + ' da Reforma para o FCX' : ''} · ${r.resumo.pendente} pendente(s) de revisão.`);
  if (ctV1399()) {
    const lidas = (f.contas || []).length, pend = Number((r.resumo && r.resumo.pendente) || 0);
    PAI.CargaFeedback.mostrar({ origem: 'Módulo Contábil · Importar contas do FCX', arquivos: [{ nome: 'Plano de contas do FCX (leitura direta)' }], lidas, processadas: Number(r.novos) || 0, vazioOk: true,
      inconsistencias: pend ? [{ tipo: 'aviso', item: pend + ' conta(s) pendente(s) de revisão', motivo: 'confira o de-para na aba De-para antes de lançar' }] : [],
      campos: [['Contas do FCX lidas', String(lidas)], ['Mapeadas agora', String(Number(r.novos) || 0)], ['Contas novas no plano', String((r.criadas || []).length)], ...(r.planoCriado ? [['Plano padrão criado', r.planoCriado + ' contas']] : []), ...(r.complemento ? [['Complemento da Reforma para o FCX', String(r.complemento)]] : [])] });
  }
}

  async 'ls-filtrar'() { S.ls.de = $('#ls-de').value; S.ls.ate = $('#ls-ate').value; S.ls.conta = $('#ls-conta').value.trim(); await carregarLancs(); render(); },
  'le-abrir'(el) { S.ls.estorno = el.dataset.v || null; render(); if (S.ls.estorno) $('#le-motivo')?.focus(); },
  async 'le-confirmar'(el) { const r = await api('POST', '/lancamentos/estorno', { id: el.dataset.v, motivo: $('#le-motivo').value, data: $('#le-data').value }); S.ls.estorno = null; await carregarBase(); await carregarLancs(); render(); toast(`Estorno nº ${r.estorno.numero} gravado, ligado ao lançamento original.`); },
  'rl-modelo'(el) { S.rl.modelo = el.dataset.v; if (S.rl.dados && S.rl.tipo === 'dre') return acoes['rl-gerar'](); render(); },
  async 'rl-gerar'() {
    const R = S.rl; lerCtlRel(); const p = new URLSearchParams({ de: R.de, ate: R.ate });
    if (R.tipo === 'dre') { p.set('modelo', R.modelo || S.st.parametros.dreModelo); if ((R.modelo || S.st.parametros.dreModelo) === 'reforma' && R.anoReforma) p.set('anoReforma', R.anoReforma); }
    if (R.tipo === 'razao') { if (!R.conta) return toast('Informe a conta do razão.'); p.set('conta', R.conta); }
    if (R.tipo === 'lalur') p.set('regime', R.regime || S.st.parametros.regime);
    R.carregando = true; render();
    try { R.dados = await api('GET', `/relatorios/${R.tipo}?${p}`); } finally { R.carregando = false; render(); }
  },
  'rl-imprimir'() {
    const R = S.rl, D = PAI && PAI.Documento, el = $('#relatorio');
    let novo = false; try { novo = !!(D && PAI.Recursos && PAI.Recursos.ativo('rel_v1389')); } catch (e) { novo = false; }
    if (!novo || !el) { window.print(); return; }
    const tit = (RELS.find(x => x[0] === R.tipo) || [R.tipo, 'Relatório'])[1], br = d => d ? String(d).split('-').reverse().join('/') : '';
    const css = `.tbl{overflow:visible;border:0;max-height:none} table{border-collapse:collapse;width:100%;font-size:9.5pt} th,td{padding:4px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top} th{background:#f2f2f2;font-size:8.5pt;color:#333}
      td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} tr.sint td{font-weight:700} tr.tot td{font-weight:700;border-top:2px solid #999} tr.sub td{font-weight:600}
      .pill{display:inline-block;font-size:8pt;font-weight:700;padding:1px 6px;border:1px solid #bbb;border-radius:10px} .hint,.muted{color:#555;font-size:8.5pt} .mono{font-family:ui-monospace,Menlo,monospace;font-size:8.5pt}
      .ind1{padding-left:14px}.ind2{padding-left:26px}.ind3{padding-left:38px}.ind4{padding-left:50px}.ind5{padding-left:62px}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0} .cmp div{border:1px solid #ccc;border-radius:6px;padding:6px} .cmp b{display:block;font-size:12pt}
      .rel-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px} .no-print,button{display:none!important} h2{font-size:12pt;margin:0 0 6px} h3{font-size:10.5pt;margin:10px 0 4px}`;
    const html = D.montar(tit, D.cabecalho(tit, `Módulo Contábil · ${br(R.de)} a ${br(R.ate)}`) + el.innerHTML, { paisagem: ['balancete', 'diario', 'razao', 'dmpl', 'balanco'].includes(R.tipo), margem: '12mm 10mm', css });
    D.previa(tit, html, `${tit.replace(/[^\wÀ-ú]+/g, '_')}_${R.de || ''}_a_${R.ate || ''}`);
  },
  async 'pp-salvar'() {
    const n = id => lerValor($(id).value) / 100, d = { regime: ($('[name="pp-regime"]:checked') || {}).value, dreModelo: ($('[name="pp-dre"]:checked') || {}).value, lc224: $('#pp-lc224').checked, contaResultado: $('#pp-res').value,
      presumido: { irpjComercio: n('#pp-irpjComercio'), csllComercio: n('#pp-csllComercio'), irpjServicos: n('#pp-irpjServicos'), csllServicos: n('#pp-csllServicos') }, reforma: { ano: Number($('#pp-ano').value), cbs: n('#pp-cbs'), ibs: n('#pp-ibs'), is: n('#pp-is') } };
    const r = await api('PUT', '/parametros', d); S.st.parametros = r.parametros; S.rl.dados = null; render(); toast('Parâmetros salvos.');
  },
  async 'pf-salvar'() { const v = $('#pf-data').value || null; const r = await api('PUT', '/parametros', { fechadoAte: v }); S.st.parametros = r.parametros; render(); toast(v ? 'Período fechado até ' + dataBR(v) + '.' : 'Fechamento removido.'); },
  async 'lz-ver'() { S.pr.ano = Number($('#lz-ano').value) || S.pr.ano; S.pr.lalur = (await api('GET', '/lalur?ano=' + S.pr.ano)).ajustes; render(); },
  async 'lz-incluir'() { await api('POST', '/lalur', { ano: S.pr.ano, tipo: $('#lz-tipo').value, base: $('#lz-base').value, descricao: $('#lz-desc').value, valor: $('#lz-valor').value }); await acoes['lz-ver'](); toast('Ajuste do LALUR incluído.'); },
  async 'lz-tirar'(el) { if (!confirmar('lz' + el.dataset.v, 'Remover este ajuste do LALUR?')) return; await api('DELETE', '/lalur?id=' + el.dataset.v); await acoes['lz-ver'](); },
  async enc() { const ano = Number($('#pe-ano').value); if (!confirmar('enc' + ano, `Encerrar o exercício de ${ano}? As contas de resultado serão zeradas contra ${S.st.parametros.contaResultado}.`)) return; const r = await api('POST', '/encerramento', { ano }); await carregarBase(); render(); toast(`Exercício de ${ano} encerrado: resultado ${fmt(r.resultado)}.`); },
  async integ() { S.pr.integ = await api('GET', '/integridade'); render(); },
};
async function aplicarDepara(r) { const m = new Map(r.itens.map(x => [x.chave, x])); S.dp.itens = S.dp.itens.map(x => m.get(x.chave) || x); S.dp.resumo = r.resumo; if (S.st) S.st.depara = r.resumo; render(); avisarFCX(); }
function lerCtlRel() { const R = S.rl, g = id => ($(id) ? $(id).value : null); R.tipo = g('#rl-tipo') || R.tipo; R.de = g('#rl-de') || R.de; R.ate = g('#rl-ate') || R.ate; if ($('#rl-anoref')) R.anoReforma = g('#rl-anoref'); if ($('#rl-conta')) R.conta = g('#rl-conta').trim(); if ($('#rl-regime')) R.regime = g('#rl-regime'); }

let ocupado = false;
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const f = acoes[el.dataset.a]; if (!f) return;
  e.preventDefault(); if (ocupado) return; ocupado = true; el.setAttribute('aria-busy', 'true');
  try { await f(el); } catch (err) { falhou(err); } finally { ocupado = false; el.removeAttribute('aria-busy'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pl-busca') { S.pl.busca = t.value; return render(); }
  if (t.id === 'dp-busca') { S.dp.busca = t.value; return render(); }
  if (t.id === 'lf-data') S.lf.data = t.value; if (t.id === 'lf-hist') S.lf.historico = t.value; if (t.id === 'lf-doc') S.lf.docRef = t.value;
  if (t.dataset.li != null) { const i = S.lf.itens[Number(t.dataset.li)]; i[t.dataset.f] = t.value; if (t.dataset.f === 'conta') { const x = porCodigo().get(t.value.trim()), h = t.parentElement.querySelector('.opc.hint, span.hint'); if (h) h.textContent = x ? x.nome : t.value ? 'conta não encontrada' : ''; } }
  if (S.aba === 'lancamentos') atualizarTotais();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pl-tipo') { S.pl.tipo = t.value; render(); } if (t.id === 'pl-grupo') { S.pl.grupo = t.value; render(); } if (t.id === 'pl-inativas') { S.pl.inativas = t.checked; render(); }
  if (t.id === 'rl-tipo') { lerCtlRel(); S.rl.dados = null; render(); }
  if (t.dataset.li != null && t.dataset.f === 'dc') { S.lf.itens[Number(t.dataset.li)].dc = t.value; atualizarTotais(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pn-nome') { e.preventDefault(); acoes['pn-sugerir']().catch(falhou); }
  if (e.key === 'Enter' && e.target.id === 'dp-conta') { e.preventDefault(); $('[data-a="dp-salvar"]')?.click(); }
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const i = ABAS.findIndex(a => a[0] === S.aba), n = ABAS[(i + (e.key === 'ArrowRight' ? 1 : ABAS.length - 1)) % ABAS.length][0]; irAba(n).then(() => $('#tab-' + n)?.focus()); }
});
window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.tipo === 'ct-aba') irAba(e.data.aba); });

async function iniciar() {
  try { await carregarBase(); }
  catch (e) { S.erro = e.status === 401 ? 'Sessão encerrada: entre no painel de novo.' : e.status === 403 ? 'Seu acesso não abre o Módulo Contábil (Gestão de Acessos › Contabilidade · Ler).' : e.message; return render(); }
  let a = (location.hash || '').slice(1); try { if (PAI && PAI.ModContabil && PAI.ModContabil.abaInicial) { a = PAI.ModContabil.abaInicial; PAI.ModContabil.abaInicial = null; } } catch (e) { }
  await irAba(ABAS.some(x => x[0] === a) ? a : S.st.depara && S.st.depara.pendente && !S.st.lancamentos.total ? 'depara' : 'plano');
}
window.Contabil = { S, irAba, api }; /* para testes */
iniciar();
</script>
